<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#059669">
<title>NutriFit ID</title>
<style>
/* ============================ DASAR ============================ */
:root{
  --hijau:#059669; --hijau-t:#10b981; --hijau-g:#d1fae5;
  --biru:#0ea5e9; --oranye:#f59e0b; --merah:#ef4444; --ungu:#8b5cf6;
  --bg:#f4f7f6; --kartu:#ffffff; --teks:#0f172a; --teks2:#64748b;
  --garis:#e2e8f0; --radius:16px;
  --bayang:0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.05);
}
html[data-tema="gelap"]{
  --bg:#0b1220; --kartu:#151d2e; --teks:#e2e8f0; --teks2:#94a3b8;
  --garis:#243044; --hijau-g:#053b2c;
  --bayang:0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{
  margin:0; background:var(--bg); color:var(--teks);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:15px; line-height:1.5; padding-bottom:88px;
}
h1,h2,h3,h4{margin:0 0 8px; line-height:1.25}
h2{font-size:19px} h3{font-size:16px} h4{font-size:14px}
p{margin:0 0 10px}
a{color:var(--hijau); text-decoration:none}
.kecil{font-size:12.5px; color:var(--teks2)}
.tengah{text-align:center}
.baris{display:flex; gap:10px; align-items:center}
.baris.rata{justify-content:space-between}
.wrap{flex-wrap:wrap}
.tumbuh{flex:1; min-width:0}
.sembunyi{display:none !important}

/* ============================ HEADER ============================ */
header{
  position:sticky; top:0; z-index:40; background:linear-gradient(135deg,#059669,#0d9488);
  color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-top)) 16px;
  padding-top:calc(14px + env(safe-area-inset-top));
  box-shadow:0 2px 12px rgba(5,150,105,.25);
}
header .judul{font-size:18px; font-weight:700; letter-spacing:-.3px}
header .sub{font-size:12px; opacity:.9}
.tombol-ikon{
  width:38px; height:38px; border-radius:12px; border:0; cursor:pointer;
  background:rgba(255,255,255,.18); color:#fff; font-size:17px;
  display:flex; align-items:center; justify-content:center;
}
.tombol-ikon:active{transform:scale(.94)}
.lencana-status{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
  background:rgba(255,255,255,.2); padding:3px 9px; border-radius:99px;
}
.titik{width:7px; height:7px; border-radius:50%; background:#4ade80}
.titik.off{background:#fbbf24}
.titik.sync{background:#38bdf8; animation:kedip 1s infinite}
@keyframes kedip{50%{opacity:.3}}

/* ============================ NAVIGASI ============================ */
nav.tab{
  position:sticky; top:0; z-index:35; background:var(--kartu);
  border-bottom:1px solid var(--garis); overflow-x:auto; white-space:nowrap;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
nav.tab::-webkit-scrollbar{display:none}
nav.tab button{
  border:0; background:none; padding:12px 14px; font-size:13.5px; font-weight:600;
  color:var(--teks2); cursor:pointer; border-bottom:3px solid transparent; font-family:inherit;
}
nav.tab button.aktif{color:var(--hijau); border-bottom-color:var(--hijau)}

/* nav bawah untuk layar kecil */
.nav-bawah{
  position:fixed; bottom:0; left:0; right:0; z-index:45; background:var(--kartu);
  border-top:1px solid var(--garis); display:flex; justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.nav-bawah button{
  border:0; background:none; font-family:inherit; cursor:pointer; color:var(--teks2);
  font-size:10px; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:4px 6px; flex:1;
}
.nav-bawah button span.ik{font-size:19px; line-height:1}
.nav-bawah button.aktif{color:var(--hijau)}

/* ============================ KARTU ============================ */
main{max-width:900px; margin:0 auto; padding:14px}
.kartu{
  background:var(--kartu); border-radius:var(--radius); padding:16px;
  box-shadow:var(--bayang); margin-bottom:14px; border:1px solid var(--garis);
}
.kartu.rapat{padding:12px}
.grid{display:grid; gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
@media(max-width:520px){ .g3{grid-template-columns:repeat(2,1fr)} }

/* ============================ TOMBOL ============================ */
button.b{
  border:0; border-radius:12px; padding:11px 16px; font-size:14px; font-weight:600;
  cursor:pointer; font-family:inherit; background:var(--hijau); color:#fff;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
button.b:active{transform:scale(.97)}
button.b:disabled{opacity:.5; cursor:not-allowed}
button.b.abu{background:var(--garis); color:var(--teks)}
button.b.garis{background:transparent; border:1.5px solid var(--garis); color:var(--teks)}
button.b.merah{background:var(--merah)}
button.b.biru{background:var(--biru)}
button.b.ungu{background:var(--ungu)}
button.b.kecilb{padding:7px 11px; font-size:12.5px; border-radius:9px}
button.b.penuh{width:100%}

/* ============================ FORM ============================ */
label.f{display:block; font-size:12.5px; font-weight:600; color:var(--teks2); margin:0 0 5px}
input,select,textarea{
  width:100%; padding:10px 12px; border:1.5px solid var(--garis); border-radius:11px;
  font-size:15px; font-family:inherit; background:var(--bg); color:var(--teks); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--hijau)}
textarea{resize:vertical; min-height:80px}
.ruas{margin-bottom:12px}

/* ============================ ELEMEN KHUSUS ============================ */
.cincin{position:relative; width:150px; height:150px; margin:0 auto}
.cincin svg{transform:rotate(-90deg)}
.cincin .isi{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
}
.cincin .angka{font-size:30px; font-weight:800; letter-spacing:-1px}

.bar{height:8px; background:var(--garis); border-radius:99px; overflow:hidden; margin-top:6px}
.bar>i{display:block; height:100%; border-radius:99px; background:var(--hijau); transition:width .4s}

.stat{background:var(--bg); border-radius:13px; padding:12px; border:1px solid var(--garis)}
.stat .nilai{font-size:20px; font-weight:800; letter-spacing:-.5px}
.stat .label{font-size:11.5px; color:var(--teks2); font-weight:600}

.chip{
  display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:99px;
  font-size:11.5px; font-weight:600; background:var(--hijau-g); color:var(--hijau);
}
.chip.abu{background:var(--garis); color:var(--teks2)}
.chip.oranye{background:#fef3c7; color:#b45309}
.chip.merah{background:#fee2e2; color:#b91c1c}
.chip.biru{background:#e0f2fe; color:#0369a1}

.item{
  display:flex; gap:11px; align-items:center; padding:11px 0; border-bottom:1px solid var(--garis);
}
.item:last-child{border-bottom:0}
.item .emo{
  width:42px; height:42px; border-radius:12px; background:var(--bg); display:flex;
  align-items:center; justify-content:center; font-size:21px; flex-shrink:0;
}

.grafik{display:flex; align-items:flex-end; gap:6px; height:130px; padding-top:8px}
.grafik>div{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%}
.grafik .btg{
  width:100%; background:linear-gradient(180deg,var(--hijau-t),var(--hijau));
  border-radius:6px 6px 0 0; margin-top:auto; min-height:3px; transition:height .5s;
}
.grafik .lbl{font-size:10px; color:var(--teks2)}

#peta{height:320px; border-radius:13px; overflow:hidden; background:var(--bg); border:1px solid var(--garis)}
#peta.mini{height:180px}

.gelembung{max-width:82%; padding:10px 13px; border-radius:15px; font-size:14px; white-space:pre-wrap}
.gelembung.saya{background:var(--hijau); color:#fff; margin-left:auto; border-bottom-right-radius:4px}
.gelembung.ai{background:var(--bg); border:1px solid var(--garis); border-bottom-left-radius:4px}

/* ============================ MODAL ============================ */
.tirai{
  position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:4000; display:flex;
  align-items:flex-end; justify-content:center; padding:0; backdrop-filter:blur(2px);
}
@media(min-width:640px){ .tirai{align-items:center; padding:20px} }
.modal{
  background:var(--kartu); width:100%; max-width:600px; max-height:90vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:18px; padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
@media(min-width:640px){ .modal{border-radius:20px} }
.modal-judul{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px}
.tutup{border:0; background:var(--bg); width:32px; height:32px; border-radius:10px; font-size:17px; cursor:pointer; color:var(--teks)}

/* ================= KARTU BAGIKAN (POLA HUAWEI HEALTH) ================= */
.bagi-pratinjau{
  width:100%; max-width:300px; margin:0 auto; display:block; border-radius:14px;
  box-shadow:0 8px 28px rgba(15,23,42,.22); background:var(--bg);
}
.bagi-tema{display:flex; gap:8px; overflow-x:auto; padding:3px 1px; scrollbar-width:none}
.bagi-tema::-webkit-scrollbar{display:none}
.bagi-tema button{
  flex:none; border:2px solid transparent; border-radius:11px; padding:0;
  width:52px; height:52px; cursor:pointer; position:relative; overflow:hidden;
  font-family:inherit; font-size:10px; font-weight:800; color:#fff;
  display:flex; align-items:flex-end; justify-content:center; padding-bottom:4px;
}
.bagi-tema button.aktif{border-color:var(--hijau); box-shadow:0 0 0 2px var(--hijau-g)}
.t-malam{background:linear-gradient(160deg,#0f172a,#1e3a5f)}
.t-terang{background:linear-gradient(160deg,#f1f5f9,#cbd5e1); color:#334155 !important}
.t-jingga{background:linear-gradient(160deg,#fc5200,#f59e0b)}
.t-hutan{background:linear-gradient(160deg,#064e3b,#059669)}
.t-foto{background:linear-gradient(160deg,#475569,#94a3b8)}

/* ================= MODE LAYAR REDUP ================= */
.redup{
  position:fixed; inset:0; z-index:7000; background:#000; color:#4b5563;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:24px; cursor:pointer; user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.redup .r-jam{font-size:52px; font-weight:800; letter-spacing:-2px; font-variant-numeric:tabular-nums; color:#6b7280}
.redup .r-jarak{font-size:30px; font-weight:800; letter-spacing:-1px; margin-top:6px; color:#4b5563}
.redup .r-sat{font-size:12px; font-weight:700; letter-spacing:1.5px; color:#374151; margin-top:3px}
.redup .r-ket{position:fixed; bottom:calc(26px + env(safe-area-inset-bottom)); font-size:11.5px; color:#374151; line-height:1.7}
.redup .r-titik{width:7px; height:7px; border-radius:50%; background:#7f1d1d; display:inline-block; margin-right:5px; animation:kedip 1.6s infinite}

.peringatan-jeda{
  background:#fef6e7; border:1px solid #b45309; color:#7c2d12; border-radius:11px;
  padding:9px 11px; font-size:12.5px; line-height:1.6; margin-top:10px;
}

/* ================= PEREKAM AKTIVITAS (POLA STRAVA) ================= */
.subnav{display:flex; gap:6px; background:var(--bg); padding:4px; border-radius:13px}
.subnav button{
  flex:1; border:0; background:transparent; padding:9px 6px; border-radius:10px;
  font-size:13px; font-weight:700; color:var(--teks2); cursor:pointer; font-family:inherit;
}
.subnav button.aktif{background:var(--kartu); color:var(--hijau); box-shadow:0 1px 4px rgba(0,0,0,.09)}

.rekam-utama{background:linear-gradient(160deg,#0f766e,#065f46); color:#fff}
.rekam-utama .kecil{color:rgba(255,255,255,.72)}
.rekam-utama .stat{background:rgba(255,255,255,.11); border-color:rgba(255,255,255,.18)}
.rekam-utama .stat .nilai{color:#fff}
.rekam-utama .stat .label{color:rgba(255,255,255,.72)}
.jam-besar{
  font-size:58px; font-weight:800; letter-spacing:-3px; line-height:1.05;
  font-variant-numeric:tabular-nums; margin:2px 0 4px;
}
.metrik{padding:10px 4px}
.metrik .mlabel{font-size:11.5px; font-weight:700; color:rgba(255,255,255,.72); text-transform:uppercase; letter-spacing:.4px}
.metrik .mnilai{font-size:30px; font-weight:800; letter-spacing:-1.2px; font-variant-numeric:tabular-nums}
.metrik .msat{font-size:11.5px; color:rgba(255,255,255,.72); font-weight:600}

button.b.besar{padding:15px 18px; font-size:16px; border-radius:14px}
button.b.merahb{background:var(--merah); color:#fff}
button.b.jingga{background:#fc5200; color:#fff}

.gps-lencana{display:inline-flex; align-items:center; gap:6px; font-weight:600}
.gps-titik{width:9px; height:9px; border-radius:50%; display:inline-block; background:var(--garis)}
.gps-titik.baik{background:#22c55e}
.gps-titik.sedang{background:#f59e0b}
.gps-titik.buruk{background:#ef4444}
.gps-titik.cari{background:#38bdf8; animation:kedip 1s infinite}

.titik-rekam{display:inline-block; width:8px; height:8px; border-radius:50%; background:#ef4444; animation:kedip 1.1s infinite; margin-right:4px}

/* ---- split per kilometer ---- */
.split-baris{display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px solid var(--garis)}
.split-baris:last-of-type{border-bottom:0}
.split-km{width:26px; font-size:12.5px; font-weight:800; color:var(--teks2); text-align:right}
.split-bar{flex:1; height:20px; background:var(--bg); border-radius:6px; overflow:hidden}
.split-bar>i{display:block; height:100%; border-radius:6px; background:linear-gradient(90deg,#059669,#34d399)}
.split-bar>i.tercepat{background:linear-gradient(90deg,#fc5200,#fb923c)}
.split-bar>i.sebagian{background:repeating-linear-gradient(45deg,#94a3b8,#94a3b8 5px,#cbd5e1 5px,#cbd5e1 10px)}
.split-pace{width:62px; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; text-align:right}
.split-elev{width:56px; font-size:11.5px; color:var(--teks2); text-align:right}

/* ---- profil elevasi ---- */
.elev-grafik{display:flex; align-items:flex-end; gap:1px; height:86px; margin-top:8px;
  background:var(--bg); border-radius:10px; padding:6px; border:1px solid var(--garis)}
.elev-grafik>i{flex:1; background:linear-gradient(180deg,#34d399,#059669); border-radius:2px 2px 0 0; min-height:2px}

/* ---- kartu sesi di riwayat ---- */
.sesi-kartu{
  display:flex; gap:11px; align-items:center; padding:11px 0;
  border-bottom:1px solid var(--garis); cursor:pointer;
}
.sesi-kartu:last-child{border-bottom:0}
.sesi-ikon{
  width:42px; height:42px; border-radius:12px; background:var(--hijau-g);
  display:flex; align-items:center; justify-content:center; font-size:20px; flex:none;
}
.sesi-metrik{display:flex; gap:12px; margin-top:3px}
.sesi-metrik span{font-size:12px; color:var(--teks2); font-weight:600}
.sesi-metrik b{color:var(--teks); font-weight:800}

.rekor-petak{
  background:var(--bg); border:1px solid var(--garis); border-radius:12px;
  padding:10px 11px; display:flex; flex-direction:column; gap:2px;
}
.rekor-petak .r-nilai{font-size:18px; font-weight:800; letter-spacing:-.5px}
.rekor-petak .r-label{font-size:11px; font-weight:700; color:var(--teks2); text-transform:uppercase; letter-spacing:.3px}
.rekor-petak .r-ket{font-size:11px; color:var(--teks2)}

/* ================= AVATAR, PENAMPIL ZOOM, EDITOR JALUR ================= */
.avatar-tombol{padding:0; overflow:hidden}
.avatar-tombol img{width:100%; height:100%; object-fit:cover; display:block; border-radius:inherit}
.avatar-tombol.ada-foto{border:2px solid rgba(255,255,255,.75)}

.foto-pratinjau{
  width:104px; height:104px; border-radius:50%; object-fit:cover; cursor:pointer;
  border:3px solid var(--hijau); background:var(--bg); display:inline-flex;
  align-items:center; justify-content:center; font-size:42px;
}
.foto-pratinjau.tanpa-foto{cursor:default; border-style:dashed; color:var(--redup)}
.foto-hasil{width:100%; max-height:230px; object-fit:cover; border-radius:12px; cursor:zoom-in; display:block}

.zoom-tirai{
  position:fixed; inset:0; background:rgba(2,6,23,.95); z-index:6000;
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; touch-action:none; cursor:grab;
}
.zoom-tirai img{
  max-width:94vw; max-height:82vh; width:auto; height:auto; border-radius:10px;
  transform-origin:center center; will-change:transform;
  user-select:none; -webkit-user-drag:none; box-shadow:0 20px 60px rgba(0,0,0,.55);
}
.zoom-tirai img.kecil{height:min(62vh,74vw)}
.zoom-info{
  position:fixed; top:calc(16px + env(safe-area-inset-top)); left:16px; z-index:6100;
  color:#fff; font-size:12.5px; opacity:.82; max-width:60vw;
}
.zoom-tutup{
  position:fixed; top:calc(12px + env(safe-area-inset-top)); right:14px; z-index:6100; border:0;
  background:rgba(255,255,255,.16); color:#fff; width:42px; height:42px;
  border-radius:13px; font-size:18px; cursor:pointer;
}
.zoom-alat{
  position:fixed; left:0; right:0; bottom:calc(20px + env(safe-area-inset-bottom));
  display:flex; gap:10px; justify-content:center; z-index:6100;
}
.zoom-alat button{
  border:0; background:rgba(255,255,255,.16); color:#fff; width:48px; height:48px;
  border-radius:15px; font-size:20px; cursor:pointer;
}

.kotak-edit{
  background:var(--hijau-g); border:1px solid var(--hijau); border-radius:11px;
  padding:9px 11px; font-size:12.8px; margin-bottom:10px; line-height:1.55;
}
.leaflet-container.menggambar{cursor:crosshair}
.tt-titik{
  background:#0ea5e9 !important; border:0 !important; color:#fff !important;
  font-size:10.5px !important; font-weight:800 !important; padding:1px 5px !important;
  border-radius:6px !important; box-shadow:none !important;
}
.tt-titik::before{display:none !important}

/* ============================ TOAST ============================ */
#toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:100px; z-index:5000;
  display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none; width:92%; max-width:420px;
}
.toast{
  background:#0f172a; color:#fff; padding:11px 16px; border-radius:12px; font-size:13.5px;
  box-shadow:0 8px 24px rgba(0,0,0,.25); animation:naik .25s ease;
}
.toast.ok{background:var(--hijau)} .toast.err{background:var(--merah)} .toast.info{background:var(--biru)}
@keyframes naik{from{opacity:0; transform:translateY(12px)}}

.muat{display:inline-block; width:15px; height:15px; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:putar .7s linear infinite}
.muat.hijau{border-color:var(--hijau-g); border-top-color:var(--hijau)}
@keyframes putar{to{transform:rotate(360deg)}}

.kosong{text-align:center; padding:34px 16px; color:var(--teks2)}
.kosong .ik{font-size:38px; display:block; margin-bottom:8px; opacity:.6}

@media print{
  header,nav.tab,.nav-bawah,.tanpa-cetak{display:none !important}
  body{padding:0; background:#fff}
  .kartu{box-shadow:none; border:1px solid #ccc; page-break-inside:avoid}
}
</style>
</head>
<body>

<header>
  <div class="baris rata">
    <div class="tumbuh">
      <div class="judul">🥗 NutriFit ID</div>
      <div class="sub" id="hdrSub">Memuat data…</div>
    </div>
    <div class="baris" style="gap:7px">
      <button class="tombol-ikon" id="btnTema" title="Ganti tema">🌙</button>
      <button class="tombol-ikon" id="btnNotif" title="Pengingat">🔔</button>
      <button class="tombol-ikon avatar-tombol" id="btnProfil" title="Profil">👤</button>
    </div>
  </div>
  <div class="baris" style="margin-top:9px; gap:7px">
    <span class="lencana-status" id="statusKoneksi"><span class="titik"></span><span id="statusTeks">Online</span></span>
    <span class="lencana-status" id="lencanaStreak">🔥 0 hari</span>
    <span class="lencana-status" id="lencanaLevel">⭐ Level 1</span>
  </div>
</header>

<nav class="tab" id="navAtas"></nav>

<main id="tampilan">
  <div class="kartu tengah" style="padding:40px">
    <span class="muat hijau" style="width:26px;height:26px;border-width:3px"></span>
    <p class="kecil" style="margin-top:12px">Menyiapkan NutriFit ID…</p>
  </div>
</main>

<div class="nav-bawah" id="navBawah"></div>
<div id="toast"></div>
<div id="modalHost"></div>

<script>
/* ==================================================================
   NutriFit ID — Front-end
   Satu berkas untuk dua mode:
   - Mode Apps Script : memakai google.script.run
   - Mode GitHub Pages: memakai fetch ke URL Web App (dari config.js)
   ================================================================== */

/* ---------- 1. LAPISAN API ---------- */
var CFG = window.NUTRIFIT_CONFIG || {};
var MODE = (CFG.gasUrl && CFG.gasUrl.indexOf('http') === 0) ? 'fetch'
         : (typeof google !== 'undefined' && google.script && google.script.run) ? 'gas'
         : 'lokal';

function api(aksi, data){
  data = data || {};
  if(MODE === 'gas'){
    return new Promise(function(res, rej){
      google.script.run
        .withSuccessHandler(function(t){
          var r; try{ r = JSON.parse(t); }catch(e){ return rej(new Error('Balasan server tidak valid.')); }
          r.ok ? res(r.data) : rej(new Error(r.error || 'Gagal'));
        })
        .withFailureHandler(function(e){ rej(new Error(e && e.message ? e.message : 'Gagal menghubungi server')); })
        .apiCall(aksi, data);
    });
  }
  if(MODE === 'fetch'){
    return fetch(CFG.gasUrl, {
      method:'POST', redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=utf-8'},   /* hindari preflight CORS */
      body: JSON.stringify({api:aksi, payload:data})
    }).then(function(r){ return r.json(); })
      .then(function(r){ if(!r.ok) throw new Error(r.error||'Gagal'); return r.data; });
  }
  return Promise.reject(new Error('Aplikasi belum tersambung ke server. Isi gasUrl pada config.js.'));
}

/* ---------- 2. PENYIMPANAN LOKAL ---------- */
var K = {DATA:'nutrifit_data', ANTREAN:'nutrifit_antrean', TEMA:'nutrifit_tema',
         REKAM:'nutrifit_rekam_berjalan'};

function simpan(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function baca(k,d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }

/* ---------- 3. STATUS APLIKASI ---------- */
var S = null;                       /* seluruh data dari server / cache */
var tab = 'ringkasan';
var online = navigator.onLine;
var sedangSync = false;

var TABS = [
  {id:'ringkasan',  nama:'Ringkasan',  ik:'📊'},
  {id:'catat',      nama:'Catat Makan',ik:'🍽️'},
  {id:'peta',       nama:'Peta Workout',ik:'🗺️'},
  {id:'barcode',    nama:'Barcode',    ik:'📷'},
  {id:'resep',      nama:'Resep Sehat',ik:'👨‍🍳'},
  {id:'wearable',   nama:'Wearable HR',ik:'⌚'},
  {id:'komunitas',  nama:'Komunitas',  ik:'👥'},
  {id:'ahligizi',   nama:'Ahli Gizi AI',ik:'💬'},
  {id:'laporan',    nama:'Kalender & Laporan',ik:'📅'}
];
var TAB_BAWAH = ['ringkasan','catat','barcode','resep','laporan'];

/* ---------- 4. UTILITAS ---------- */
function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* untuk menaruh string di dalam atribut onclick="fn('...')" */
function jsq(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;').replace(/\n/g,' '); }
function hariIni(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return (n<10?'0':'')+n; }
function jamKini(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function idBaru(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).substr(2,4); }
function n(v,d){ var x=Number(v); return isNaN(x)?(d||0):x; }
function rb(x){ return Math.round(n(x)).toLocaleString('id-ID'); }
function namaHari(tgl){
  var h=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  return h[new Date(tgl+'T00:00:00').getDay()];
}
function tglIndo(tgl){
  var b=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  var d=new Date(tgl+'T00:00:00');
  return d.getDate()+' '+b[d.getMonth()]+' '+d.getFullYear();
}
function toast(pesan, jenis){
  var el=document.createElement('div');
  el.className='toast '+(jenis||'');
  el.textContent=pesan;
  document.getElementById('toast').appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){ el.remove(); }, 320); }, 2800);
}
var KATEGORI = {sarapan:'Sarapan', makan_siang:'Makan Siang', makan_malam:'Makan Malam', camilan:'Camilan'};
var TUJUAN = {turun_bb:'Turunkan Berat Badan', jaga_bb:'Jaga Berat Badan', tambah_otot:'Tambah Massa Otot', hidup_sehat:'Hidup Lebih Sehat'};
var AKTIVITAS = {sedentari:'Jarang Bergerak', ringan:'Aktivitas Ringan', sedang:'Aktivitas Sedang', berat:'Aktivitas Berat', ekstrem:'Sangat Berat'};

/* ---------- 5. ANTREAN OFFLINE ---------- */
/**
 * Semua perubahan data melewati fungsi ini.
 * Saat online  : langsung dikirim ke server.
 * Saat offline : disimpan di localStorage, diterapkan ke data lokal,
 *                lalu dikirim otomatis ketika koneksi kembali.
 */
function ubah(aksi, data, terapkanLokal){
  if(typeof terapkanLokal === 'function') terapkanLokal();
  simpan(K.DATA, S);
  render();

  if(online && MODE !== 'lokal'){
    return api(aksi, data).then(function(hasil){
      return hasil;
    }).catch(function(e){
      antrekan(aksi, data);
      toast('Disimpan offline: '+e.message, 'info');
    });
  }
  antrekan(aksi, data);
  return Promise.resolve(null);
}

function antrekan(aksi, data){
  var q = baca(K.ANTREAN, []);
  q.push({id:idBaru('q'), aksi:aksi, data:data, waktu:new Date().toISOString()});
  simpan(K.ANTREAN, q);
  perbaruiStatus();
}

function sinkronAntrean(){
  var q = baca(K.ANTREAN, []);
  if(!q.length || !online || sedangSync || MODE === 'lokal') return Promise.resolve();
  sedangSync = true; perbaruiStatus();
  return api('sync_batch', {antrean:q}).then(function(r){
    simpan(K.ANTREAN, []);
    toast('Sinkronisasi selesai: '+r.diproses+' perubahan terkirim', 'ok');
    return muatData(true);
  }).catch(function(e){
    toast('Sinkronisasi tertunda: '+e.message, 'info');
  }).then(function(){
    sedangSync = false; perbaruiStatus();
  });
}

function perbaruiStatus(){
  var q = baca(K.ANTREAN, []).length;
  var t = document.getElementById('statusTeks');
  var d = document.querySelector('#statusKoneksi .titik');
  if(!t) return;
  if(sedangSync){ t.textContent='Menyinkronkan…'; d.className='titik sync'; }
  else if(!online){ t.textContent = q ? ('Offline · '+q+' tertunda') : 'Mode Offline'; d.className='titik off'; }
  else if(q){ t.textContent = q+' tertunda'; d.className='titik off'; }
  else { t.textContent='Online'; d.className='titik'; }
}

/* ---------- 6. MUAT DATA ---------- */
function muatData(diam){
  var cache = baca(K.DATA, null);
  if(cache && !S){ S = cache; render(); }

  if(!online || MODE === 'lokal'){
    if(!S){ gagalMuat('Tidak ada koneksi dan belum ada data tersimpan.'); }
    return Promise.resolve();
  }
  return api('bootstrap', {}).then(function(d){
    S = d; simpan(K.DATA, d); render();
    if(!diam) toast('Data termuat', 'ok');
  }).catch(function(e){
    if(S){ if(!diam) toast('Memakai data tersimpan: '+e.message, 'info'); }
    else gagalMuat(e.message);
  });
}

function gagalMuat(pesan){
  document.getElementById('tampilan').innerHTML =
    '<div class="kartu tengah" style="padding:36px">' +
      '<div style="font-size:40px">📡</div>' +
      '<h3 style="margin-top:10px">Belum bisa memuat data</h3>' +
      '<p class="kecil">'+esc(pesan)+'</p>' +
      '<button class="b" onclick="muatData()">Coba Lagi</button>' +
    '</div>';
}

/* ---------- 7. PERHITUNGAN LOKAL ---------- */
function catatanTanggal(tgl){
  return (S.catatanMakan||[]).filter(function(c){ return c.date === tgl; });
}
function totalHarian(tgl){
  var t={kalori:0,protein:0,karbo:0,lemak:0};
  catatanTanggal(tgl).forEach(function(c){
    var q=n(c.quantity,1), f=c.foodItem||{};
    t.kalori+=n(f.calories)*q; t.protein+=n(f.protein)*q;
    t.karbo+=n(f.carbs)*q; t.lemak+=n(f.fat)*q;
  });
  t.kalori=Math.round(t.kalori); t.protein=Math.round(t.protein);
  t.karbo=Math.round(t.karbo); t.lemak=Math.round(t.lemak);
  return t;
}
function airHari(tgl){ return n((S.air||{})[tgl]); }
function aktivitasHari(tgl){
  var a=(S.aktivitas||[]).filter(function(x){ return x.date===tgl; })[0];
  return a || {date:tgl, steps:0, activeCalories:0, distanceKm:0, sleepHours:0, avgHeartRate:0, maxHeartRate:0};
}
function tujuhHari(){
  var out=[], d=new Date();
  for(var i=6;i>=0;i--){
    var x=new Date(d.getTime()-i*86400000);
    out.push(x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()));
  }
  return out;
}

/* ---------- 8. RENDER UTAMA ---------- */
function render(){
  if(!S) return;
  var p = S.profil || {};
  document.getElementById('hdrSub').textContent =
    (p.name || 'Pengguna') + ' · ' + (TUJUAN[p.dietaryGoal] || 'Hidup Sehat');
  document.getElementById('lencanaStreak').innerHTML = '🔥 '+n(p.streakDays)+' hari';
  document.getElementById('lencanaLevel').innerHTML = '⭐ Level '+n(p.userLevel,1);
  perbaruiStatus();

  document.getElementById('navAtas').innerHTML = TABS.map(function(t){
    return '<button class="'+(tab===t.id?'aktif':'')+'" onclick="pindah(\''+t.id+'\')">'+t.ik+' '+t.nama+'</button>';
  }).join('');

  document.getElementById('navBawah').innerHTML = TAB_BAWAH.map(function(id){
    var t = TABS.filter(function(x){return x.id===id})[0];
    return '<button class="'+(tab===id?'aktif':'')+'" onclick="pindah(\''+id+'\')">' +
           '<span class="ik">'+t.ik+'</span>'+t.nama.split(' ')[0]+'</button>';
  }).join('');

  var f = {
    ringkasan:viewRingkasan, catat:viewCatat, peta:viewPeta, barcode:viewBarcode,
    resep:viewResep, wearable:viewWearable, komunitas:viewKomunitas,
    ahligizi:viewAhliGizi, laporan:viewLaporan
  }[tab] || viewRingkasan;

  /* Selagi rekaman berjalan, tampilan tidak dibangun ulang: peta, jejak GPS,
     dan penghitung waktu harus bertahan. Cukup angkanya yang disegarkan. */
  if(!paksaRender && sedangMerekam() && tab==='peta' && subPeta==='rekam'
     && document.getElementById('recJam')){
    perbaruiTampilanRec();
    perbaruiAvatarHeader();
    return;
  }

  document.getElementById('tampilan').innerHTML = f();
  perbaruiAvatarHeader();
  if(typeof window['sesudah_'+tab] === 'function') window['sesudah_'+tab]();
}

var paksaRender=false;
/** Membangun ulang tampilan walau rekaman sedang berjalan. */
function renderPaksa(){ paksaRender=true; try{ render(); } finally { paksaRender=false; } }

/* Tombol profil di bilah atas menampilkan foto bila pengguna sudah memasangnya. */
function perbaruiAvatarHeader(){
  var b=document.getElementById('btnProfil'); if(!b) return;
  var u=(S && S.profil && S.profil.profilePictureUrl) || '';
  if(u){
    if(b.getAttribute('data-foto')!==String(u.length)){
      b.innerHTML='<img src="'+esc(u)+'" alt="Foto profil">';
      b.setAttribute('data-foto', String(u.length));
    }
    b.classList.add('ada-foto');
  } else {
    if(b.getAttribute('data-foto')!=='0'){ b.innerHTML='👤'; b.setAttribute('data-foto','0'); }
    b.classList.remove('ada-foto');
  }
}

function pindah(id){
  if(id!=='peta') bersihkanPeta();
  tab = id;
  renderPaksa();
  window.scrollTo({top:0, behavior:'smooth'});
}

/** Melepas objek peta saat meninggalkan tab agar tidak dipakai setelah dibuang. */
function bersihkanPeta(){
  if(petaObj){ try{ petaObj.remove(); }catch(e){} }
  petaObj=null; lapisanRute=null; lapisanDraft=null; penandaDraft=[];
  penandaSaya=null; penandaRec=null; lapisanRec=null; lapisanRencana=null;
}

/* ================================================================
   TAB 1 — RINGKASAN
   ================================================================ */
function viewRingkasan(){
  var p=S.profil||{}, tgl=hariIni(), t=totalHarian(tgl);
  var target=n(p.dailyCalorieTarget,2000);
  var sisa=target-t.kalori;
  var persen=Math.min(100, target? (t.kalori/target*100) : 0);
  var air=airHari(tgl), targetAir=n(p.dailyWaterTargetMl,2500);
  var akt=aktivitasHari(tgl), targetLangkah=n(p.dailyStepsTarget,8000);
  var d=p.turunan||{};

  var keliling=2*Math.PI*62;
  var offset=keliling-(persen/100*keliling);

  var h='';

  /* cincin kalori */
  h+='<div class="kartu">'+
      '<div class="baris rata" style="margin-bottom:10px">'+
        '<h2>Kalori Hari Ini</h2>'+
        '<span class="chip">'+tglIndo(tgl)+'</span>'+
      '</div>'+
      '<div class="cincin">'+
        '<svg width="150" height="150">'+
          '<circle cx="75" cy="75" r="62" fill="none" stroke="var(--garis)" stroke-width="13"/>'+
          '<circle cx="75" cy="75" r="62" fill="none" stroke="'+(sisa<0?'var(--merah)':'var(--hijau)')+'" stroke-width="13" '+
            'stroke-linecap="round" stroke-dasharray="'+keliling+'" stroke-dashoffset="'+offset+'"/>'+
        '</svg>'+
        '<div class="isi">'+
          '<div class="angka">'+rb(Math.abs(sisa))+'</div>'+
          '<div class="kecil">'+(sisa<0?'kelebihan':'sisa kkal')+'</div>'+
        '</div>'+
      '</div>'+
      '<div class="grid g3" style="margin-top:14px">'+
        kartuStat('Terkonsumsi', rb(t.kalori)+' kkal', '')+
        kartuStat('Target', rb(target)+' kkal','')+
        kartuStat('Dibakar', rb(akt.activeCalories)+' kkal','')+
      '</div>'+
    '</div>';

  /* makro */
  h+='<div class="kartu"><h3>Makronutrien</h3>'+
      barMakro('Protein', t.protein, n(p.dailyProteinTarget,100), 'g', 'var(--merah)')+
      barMakro('Karbohidrat', t.karbo, n(p.dailyCarbsTarget,220), 'g', 'var(--oranye)')+
      barMakro('Lemak', t.lemak, n(p.dailyFatTarget,55), 'g', 'var(--ungu)')+
    '</div>';

  /* hidrasi + langkah */
  h+='<div class="grid g2">'+
      '<div class="kartu rapat">'+
        '<div class="baris rata"><h4>💧 Hidrasi</h4><span class="kecil">'+rb(air)+'/'+rb(targetAir)+' ml</span></div>'+
        '<div class="bar"><i style="width:'+Math.min(100,targetAir?air/targetAir*100:0)+'%; background:var(--biru)"></i></div>'+
        '<div class="baris" style="margin-top:9px; gap:6px; flex-wrap:wrap">'+
          '<button class="b kecilb biru" onclick="tambahAir(250)">+250</button>'+
          '<button class="b kecilb biru" onclick="tambahAir(500)">+500</button>'+
          '<button class="b kecilb abu" onclick="tambahAir(-250)">−250</button>'+
        '</div>'+
      '</div>'+
      '<div class="kartu rapat">'+
        '<div class="baris rata"><h4>👟 Langkah</h4><span class="kecil">'+rb(akt.steps)+'/'+rb(targetLangkah)+'</span></div>'+
        '<div class="bar"><i style="width:'+Math.min(100,targetLangkah?akt.steps/targetLangkah*100:0)+'%; background:var(--oranye)"></i></div>'+
        '<div style="margin-top:9px">'+
          '<input type="number" id="inpLangkah" placeholder="Masukkan langkah" value="'+akt.steps+'" style="padding:7px 10px; font-size:13px">'+
          '<button class="b kecilb penuh" style="margin-top:6px" onclick="simpanLangkah()">Perbarui</button>'+
        '</div>'+
      '</div>'+
    '</div>';

  /* skor kesehatan */
  var skor = hitungSkor();
  h+='<div class="kartu">'+
      '<div class="baris rata"><h3>Skor Kesehatan Harian</h3><span class="chip '+(skor.nilai>=75?'':'oranye')+'">'+skor.nilai+'/100</span></div>'+
      '<div class="bar" style="height:11px"><i style="width:'+skor.nilai+'%"></i></div>'+
      '<p class="kecil" style="margin-top:9px">'+esc(skor.pesan)+'</p>'+
      '<div class="grid g4" style="margin-top:10px">'+
        skor.rincian.map(function(r){
          return '<div class="stat"><div class="label">'+esc(r.nama)+'</div><div class="nilai" style="font-size:16px">'+r.poin+'<span class="kecil">/'+r.maks+'</span></div></div>';
        }).join('')+
      '</div>'+
    '</div>';

  /* wawasan AI */
  h+='<div class="kartu" id="kartuWawasan">'+
      '<div class="baris rata"><h3>✨ Wawasan AI</h3>'+
        '<button class="b kecilb" onclick="mintaWawasan()" '+(S.aiAktif?'':'disabled')+'>Analisis</button></div>'+
      '<div id="isiWawasan"><p class="kecil">'+
        (S.aiAktif ? 'Tekan Analisis untuk mendapat ulasan singkat tentang pola makan dan aktivitasmu hari ini.'
                   : 'Fitur AI nonaktif. Isi GEMINI_API_KEY pada Script Properties untuk mengaktifkannya.')+
      '</p></div>'+
    '</div>';

  /* ringkas tubuh */
  h+='<div class="kartu"><h3>Profil Tubuh</h3><div class="grid g4">'+
      kartuStat('Berat', n(p.weightKg)+' kg','')+
      kartuStat('Target', n(p.targetWeightKg)+' kg','')+
      kartuStat('BMI', (d.bmi||'-'),'')+
      kartuStat('TDEE', rb(d.tdee)+' kkal','')+
    '</div>'+
    (p.profilePictureUrl
      ? '<div class="tengah" style="margin-top:12px"><img src="'+esc(p.profilePictureUrl)+'" class="foto-pratinjau" alt="Foto profil" onclick="zoomFotoProfil()"></div>'
      : '')+
    '<button class="b garis penuh" style="margin-top:11px" onclick="modalProfil()">Ubah Data Diri & Target</button></div>';

  /* pencapaian */
  var pc = (S.pencapaian||[]);
  h+='<div class="kartu"><h3>🏅 Pencapaian</h3><div class="grid g4">'+
      pc.map(function(a){
        return '<div class="stat" style="opacity:'+(a.isUnlocked?1:.55)+'">'+
          '<div style="font-size:22px">'+a.icon+'</div>'+
          '<div class="label" style="margin-top:3px">'+esc(a.title)+'</div>'+
          '<div class="bar" style="height:5px"><i style="width:'+n(a.progressPercent)+'%"></i></div></div>';
      }).join('')+
    '</div></div>';

  /* jadwal hari ini */
  var jdw=(S.jadwal||[]).filter(function(j){ return j.date===tgl; });
  h+='<div class="kartu"><div class="baris rata"><h3>🏋️ Jadwal Hari Ini</h3>'+
      '<button class="b kecilb garis" onclick="pindah(\'laporan\')">Kalender</button></div>'+
      (jdw.length ? jdw.map(barisJadwal).join('') : '<p class="kecil">Belum ada latihan terjadwal hari ini.</p>')+
    '</div>';

  return h;
}

function kartuStat(label, nilai){
  return '<div class="stat"><div class="label">'+esc(label)+'</div><div class="nilai">'+nilai+'</div></div>';
}
function barMakro(nama, kini, target, sat, warna){
  var pr = target? Math.min(100, kini/target*100) : 0;
  return '<div style="margin-bottom:11px">'+
    '<div class="baris rata"><span style="font-size:13px; font-weight:600">'+nama+'</span>'+
    '<span class="kecil">'+rb(kini)+' / '+rb(target)+' '+sat+'</span></div>'+
    '<div class="bar"><i style="width:'+pr+'%; background:'+warna+'"></i></div></div>';
}

function hitungSkor(){
  var p=S.profil||{}, tgl=hariIni(), t=totalHarian(tgl);
  var air=airHari(tgl), akt=aktivitasHari(tgl);
  var r=[];
  var pKal = n(p.dailyCalorieTarget) ? Math.max(0, 100 - Math.abs(t.kalori-n(p.dailyCalorieTarget))/n(p.dailyCalorieTarget)*100) : 0;
  r.push({nama:'Kalori', poin:Math.round(pKal*0.3), maks:30});
  r.push({nama:'Protein', poin:Math.round(Math.min(1, n(p.dailyProteinTarget)? t.protein/n(p.dailyProteinTarget):0)*25), maks:25});
  r.push({nama:'Hidrasi', poin:Math.round(Math.min(1, n(p.dailyWaterTargetMl)? air/n(p.dailyWaterTargetMl):0)*25), maks:25});
  r.push({nama:'Langkah', poin:Math.round(Math.min(1, n(p.dailyStepsTarget)? akt.steps/n(p.dailyStepsTarget):0)*20), maks:20});
  var total=r.reduce(function(a,b){ return a+b.poin; },0);
  var pesan = total>=85 ? 'Luar biasa. Pola hari ini hampir sempurna, pertahankan ritmenya.'
            : total>=65 ? 'Sudah bagus. Tinggal rapikan satu-dua aspek yang masih tertinggal.'
            : total>=40 ? 'Perlu sedikit dorongan. Mulai dari yang paling mudah dulu: minum air.'
            : 'Hari masih panjang. Catat asupanmu dan mulai bergerak sedikit demi sedikit.';
  return {nilai:total, rincian:r, pesan:pesan};
}

function tambahAir(ml){
  var tgl=hariIni();
  var baru=Math.max(0, airHari(tgl)+ml);
  ubah('air_set', {date:tgl, amountMl:baru}, function(){
    S.air = S.air||{}; S.air[tgl]=baru;
  });

var fotoMakanTerakhir=null;

function analisisFotoMakan(input){
  var file=input.files && input.files[0];
  input.value='';
  if(!file) return;
  var el=document.getElementById('hasilFotoMakan'); if(!el) return;

  if(!S.aiAktif){
    el.innerHTML='<p class="kecil" style="color:var(--oranye); margin-top:10px">Fitur AI belum aktif. Isi <b>GEMINI_API_KEY</b> pada Script Properties proyek Apps Script.</p>';
    return;
  }
  if(!online){
    el.innerHTML='<p class="kecil" style="color:var(--oranye); margin-top:10px">Analisis foto membutuhkan koneksi internet. Sementara ini, catat manual lewat tombol “+ Baru”.</p>';
    return;
  }

  el.innerHTML='<p class="kecil" style="margin-top:10px"><span class="muat hijau"></span> Membaca foto & memperkirakan gizinya…</p>';
  kecilkanGambar(file, 1024, function(b64){
    fotoMakanTerakhir='data:image/jpeg;base64,'+b64;
    api('ai_analisis_makanan', {imageBase64:b64, mimeType:'image/jpeg'}).then(function(r){
      var f=r.food||{};
      if(f.savedId){
        f.id=f.savedId;
        S.makanan=S.makanan||[];
        S.makanan=S.makanan.filter(function(x){ return x.id!==f.id; });
        S.makanan.unshift(f);

    }).catch(function(e){
      el.innerHTML='<p class="kecil" style="color:var(--merah); margin-top:10px">'+esc(e.message)+'</p>';
    });
  });
}

    '<p class="kecil" style="margin-top:8px">Dihitung dari makro: '+rb(dariMakro)+' kkal '+
      '(protein '+rb(pro*4)+' + karbo '+rb(kar*4)+' + lemak '+rb(lem*9)+').'+
      (Math.abs(dariMakro-kal)>Math.max(60, kal*0.18) ? ' Selisihnya cukup besar dari angka kalori di atas, jadi perlakukan sebagai perkiraan kasar.' : '')+'</p>'+

  h2+='<div class="kartu">'+
      '<div id="peta"></div>'+
      '<div class="baris rata" style="margin-top:9px">'+
        '<div class="kecil" id="statusGps">'+lencanaGps()+'</div>'+
        '<button class="b kecilb garis" onclick="toggleIkuti()">'+(ikutiPeta?'📍 Ikuti: nyala':'📍 Ikuti: mati')+'</button>'+
      '</div>'+
      '<button class="b garis penuh" style="margin-top:10px" onclick="modeRedup()">🌙 Redupkan Layar (hemat baterai)</button>'+
      '<div id="recJeda">'+ringkasanJedaRec()+'</div>'+
    '</div>';

  h2+='<div class="kartu"><div class="grid g2">'+
      (jeda
        ? '<button class="b penuh besar" onclick="lanjutRekam()">▶️ Lanjutkan</button>'
        : '<button class="b garis penuh besar" onclick="jedaRekam()">⏸️ Jeda</button>')+
      '<button class="b merahb penuh besar" onclick="selesaiRekam()">⏹ Selesai</button>'+
    '</div>'+
    (jeda ? '<button class="b garis penuh" style="margin-top:9px" onclick="buangRekam()">🗑 Buang Rekaman</button>' : '')+
    '</div>';

  h2+='<div id="recSplit">'+kartuSplit(rec.split, rec.jarak, rec.bergerakMs/1000, rec.patokanKm, rec.patokanDetik)+'</div>';
  return h2;
}

/** Peringatan jeda pada layar perekam; kosong bila belum pernah terputus. */
var splitTerakhir=-1;

/** Memperbarui angka pada baris kilometer yang sedang berjalan. */
function perbaruiSplitBerjalan(){
  var km=document.getElementById('spKm'); if(!km) return;
  var sisaDetik=Math.round(rec.bergerakMs/1000-rec.patokanDetik);
  km.textContent=rec.jarak.toFixed(2);
  var pace=document.getElementById('spPace');
  if(pace) pace.textContent=fmtPace(sisaDetik);
  var bar=document.getElementById('spBar');
  if(bar){
    var maks=1;
    rec.split.forEach(function(s){ if(n(s.detik)>maks) maks=n(s.detik); });
    if(!rec.split.length) maks=Math.max(1, sisaDetik);
    bar.style.width=Math.max(10, Math.min(100, Math.round(sisaDetik/maks*100)))+'%';
  }
}

function setBilaBerubah(el, html){
  if(!el) return;
  if(el.getAttribute('data-isi')===html) return;
  el.setAttribute('data-isi', html);
  el.innerHTML=html;
}

function ringkasanJedaRec(){
  if(!rec.jeda.length) return '';
  return '<div class="peringatan-jeda">⚠️ Perekaman sempat terhenti '+rec.jeda.length+
    ' kali, total '+fmtDurasi(totalJedaDetik(rec.jeda))+
    '. Jarak selama jeda itu tidak terekam dan tidak dikarang.</div>';
}

function labelStatusRec(){
  if(rec.status==='jeda') return 'DIJEDA';
  if(rec.autoJeda) return 'JEDA OTOMATIS · menunggu kamu bergerak';
  return 'WAKTU BERGERAK';
}

function metrikBesar(label, nilai, satuan, id){
  return '<div class="metrik">'+
    '<div class="mlabel">'+esc(label)+'</div>'+
    '<div class="mnilai" id="'+id+'">'+nilai+'</div>'+
    '<div class="msat">'+esc(satuan)+'</div></div>';
}

function lencanaGps(){
  if(rec.akurasi==null) return '<span class="gps-lencana"><i class="gps-titik cari"></i>Mencari sinyal GPS…</span>';
  var a=Math.round(rec.akurasi);
  var k = a<=10 ? 'baik' : (a<=25 ? 'sedang' : 'buruk');
  var ket = a<=10 ? 'akurasi baik' : (a<=25 ? 'akurasi sedang' : 'akurasi buruk, titik diabaikan');
  return '<span class="gps-lencana"><i class="gps-titik '+k+'"></i>GPS ±'+a+' m · '+ket+'</span>';
}

function toggleIkuti(){ ikutiPeta=!ikutiPeta; renderPaksa(); }

/* ---------------------------------------------------------------- kendali */

function mulaiRekam(){
  if(!navigator.geolocation) return toast('Perangkat tidak mendukung GPS','err');
  var st=document.getElementById('recTipe'), sr=document.getElementById('recRute');
  rec.tipe = st ? st.value : rec.tipe;
  rec.ruteId = sr ? sr.value : '';

  rec.status='jalan';
  rec.mulaiMs=Date.now(); rec.tikTerakhir=Date.now();
  rec.totalMs=0; rec.bergerakMs=0;
  rec.jarak=0; rec.naik=0; rec.turun=0;
  rec.jejak=[]; rec.split=[];
  rec.patokanKm=0; rec.patokanDetik=0; rec.patokanNaik=0;
  rec.kecKini=0; rec.kecMaks=0; rec.altTerakhir=null;
  rec.diamSejak=0; rec.autoJeda=false; rec.hrList=[]; rec.peringatanRute=0;
  rec.jeda=[]; rec.putusBerikut=false; rec.simpanTerakhir=0;
  splitTerakhir=-1;

  mulaiWatch();
  if(idTimerRec) clearInterval(idTimerRec);
  idTimerRec=setInterval(tikRekam, 1000);
  kunciLayar();
  nyalakanPenjaga();
  simpanStatusRekam();
  renderPaksa();
  toast('Rekaman dimulai','ok');
}

function jedaRekam(){
  if(rec.status!=='jalan') return;
  rec.status='jeda'; rec.autoJeda=false;
  renderPaksa();
  toast('Rekaman dijeda','info');
}

function lanjutRekam(){
  if(rec.status!=='jeda') return;
  rec.status='jalan'; rec.tikTerakhir=Date.now(); rec.diamSejak=0;
  renderPaksa();
  toast('Rekaman dilanjutkan','ok');
}

function hentikanRekam(){
  if(idWatch!=null){ try{ navigator.geolocation.clearWatch(idWatch); }catch(e){} idWatch=null; }
  if(idTimerRec){ clearInterval(idTimerRec); idTimerRec=null; }
  lepasLayar();
  matikanPenjaga();
  keluarRedup();
}

function buangRekam(){
  if(!confirm('Buang rekaman ini? Data yang sudah terekam tidak akan disimpan.')) return;
  hentikanRekam(); resetRekam(); renderPaksa();
  toast('Rekaman dibuang','info');
}

function resetRekam(){
  rec.status='siap'; rec.jejak=[]; rec.split=[]; rec.jarak=0;
  rec.naik=0; rec.turun=0; rec.totalMs=0; rec.bergerakMs=0;
  rec.patokanKm=0; rec.patokanDetik=0; rec.patokanNaik=0;
  rec.kecKini=0; rec.kecMaks=0; rec.autoJeda=false; rec.hrList=[];
  rec.jeda=[]; rec.putusBerikut=false;
  lapisanRec=null; penandaRec=null;
  hapusStatusRekam();
}

function selesaiRekam(){
  if(rec.jarak<0.03){
    if(!confirm('Jarak yang terekam masih sangat pendek. Buang rekaman ini?')) return;
    return buangRekam();
  }
  hentikanRekam();
  rec.status='selesai';
  modalSimpanSesi();
}

/* ---------------------------------------------------------------- GPS */

function mulaiWatch(){
  if(idWatch!=null){ try{ navigator.geolocation.clearWatch(idWatch); }catch(e){} }
  idWatch=navigator.geolocation.watchPosition(terimaPosisi, function(e){
    var el=document.getElementById('statusGps');
    if(el) el.innerHTML='<span style="color:var(--merah)">🛰️ GPS gagal: '+esc(e.message)+'</span>';
  }, {enableHighAccuracy:true, timeout:20000, maximumAge:1000});
}

function terimaPosisi(pos){
  var c=pos.coords;
  var la=c.latitude, ln=c.longitude;
  var alt=(c.altitude===null || c.altitude===undefined) ? null : c.altitude;
  rec.akurasi=c.accuracy;

  var el=document.getElementById('statusGps');
  if(el) el.innerHTML=lencanaGps();

  if(petaObj && window.L){
    if(!penandaRec){
      penandaRec=L.circleMarker([la,ln],{radius:8, color:'#ffffff', weight:3,
        fillColor:'#fc5200', fillOpacity:1}).addTo(petaObj);
    } else penandaRec.setLatLng([la,ln]);
    if(ikutiPeta){ try{ petaObj.panTo([la,ln],{animate:true}); }catch(e){} }
  }

  if(rec.status!=='jalan') return;
  if(c.accuracy!=null && c.accuracy>35) return;

  var akhir = rec.jejak.length ? rec.jejak[rec.jejak.length-1] : null;
  var detik = (Date.now()-rec.mulaiMs)/1000;

  if(!akhir){
    rec.jejak.push({lat:la, lng:ln, alt:alt, t:Math.round(detik)});
    rec.altTerakhir=alt;
    gambarJejakRec();
    return;
  }

  var dKm = jarakKm(akhir.lat, akhir.lng, la, ln);

  // Setelah halaman dibekukan sistem, titik berikutnya melompat jauh. Jarak
  // lompatan itu TIDAK ditambahkan: garis lurus antara dua titik bukan jalur
  // yang benar-benar ditempuh, dan menambahkannya berarti mengarang data.
  if(rec.putusBerikut){
    rec.putusBerikut=false;
    rec.diamSejak=0; rec.altTerakhir=alt; rec.kecKini=0;
    rec.jejak.push({lat:la, lng:ln, alt:alt, t:Math.round(detik), putus:true});
    gambarJejakRec();
    perbaruiTampilanRec();
    return;
  }

  if(dKm*1000 < 2.5){
    if(!rec.diamSejak) rec.diamSejak=Date.now();
    return;
  }
  rec.diamSejak=0;
  if(rec.autoJeda){ rec.autoJeda=false; var s=document.getElementById('recStatus'); if(s) s.textContent=labelStatusRec(); }

  var dt = detik - n(akhir.t);
  if(dt>0){
    var kec=(dKm/dt)*3600;
    if(kec<80){ rec.kecKini=kec; if(kec>rec.kecMaks) rec.kecMaks=kec; }
  }

  rec.jarak += dKm;

  if(alt!=null){
    if(rec.altTerakhir!=null){
      var dz=alt-rec.altTerakhir;
      if(Math.abs(dz)>=1.5){
        if(dz>0) rec.naik+=dz; else rec.turun+=-dz;
        rec.altTerakhir=alt;
      }
    } else rec.altTerakhir=alt;
  }

  rec.jejak.push({lat:la, lng:ln, alt:alt, t:Math.round(detik)});
  periksaSplit();
  periksaMenyimpang(la, ln);
  gambarJejakRec();
  perbaruiTampilanRec();
}

function tikRekam(){
  var kini=Date.now();
  var dt=kini-(rec.tikTerakhir||kini);
  rec.tikTerakhir=kini;
  if(rec.status!=='jalan') return;

  // Pencacah ini dijadwalkan tiap detik. Lompatan besar berarti halaman sempat
  // dibekukan sistem — layar terkunci atau peramban dipindah ke latar belakang.
  // Selama itu GPS tidak terpantau, jadi rentangnya dicatat sebagai jeda dan
  // TIDAK dihitung sebagai waktu bergerak.
  if(dt>5000){
    catatJedaRekam(kini-dt, dt);
    rec.totalMs+=dt;
    rec.putusBerikut=true;
    rec.diamSejak=0; rec.kecKini=0;
    perbaruiTampilanRec();
    simpanStatusRekam(true);
    return;
  }

  rec.totalMs+=dt;
  if(rec.diamSejak && kini-rec.diamSejak>8000 && !rec.autoJeda){
    rec.autoJeda=true; rec.kecKini=0;
  }
  if(!rec.autoJeda) rec.bergerakMs+=dt;
  perbaruiTampilanRec();
  perbaruiRedup();
  simpanStatusRekam();
}

function catatJedaRekam(mulaiMs, lamaMs){
  var detik=Math.round(lamaMs/1000);
  rec.jeda.push({mulai:Math.round((mulaiMs-rec.mulaiMs)/1000), detik:detik});
  if(rec.jeda.length>50) rec.jeda.shift();
  setBilaBerubah(document.getElementById('recJeda'), ringkasanJedaRec());
  toast('Perekaman sempat terhenti '+fmtDurasi(detik)+' karena aplikasi dibekukan sistem','info');
}

/** Total detik yang hilang karena halaman dibekukan. */
function totalJedaDetik(daftar){
  var t=0;
  (daftar||[]).forEach(function(g){ t+=n(g.detik); });
  return t;
}

function periksaSplit(){
  while(rec.jarak >= rec.patokanKm+1){
    rec.patokanKm += 1;
    var detikKini=rec.bergerakMs/1000;
    var s={km:rec.patokanKm, detik:Math.round(detikKini-rec.patokanDetik),
           naik:Math.round(rec.naik-rec.patokanNaik)};
    rec.split.push(s);
    rec.patokanDetik=detikKini; rec.patokanNaik=rec.naik;
    toast('Km '+s.km+' · '+fmtPace(s.detik)+' /km','ok');
  }
}

/** Memperingatkan sekali per menit bila menyimpang jauh dari rute yang diikuti. */
function periksaMenyimpang(la, ln){
  if(!rec.ruteId) return;
  var r=(S.rute||[]).filter(function(x){ return x.id===rec.ruteId; })[0];
  if(!r) return;
  var tk=titikRute(r);
  if(tk.length<2) return;
  var min=1e9;
  for(var i=0;i<tk.length;i++){
    var d=jarakKm(la, ln, tk[i].lat, tk[i].lng)*1000;
    if(d<min) min=d;
  }
  var kini=Date.now();
  if(min>80 && kini-rec.peringatanRute>60000){
    rec.peringatanRute=kini;
    toast('Kamu ±'+Math.round(min)+' m dari jalur rute '+r.name,'info');
  }
}

function kalRec(){
  var berat=n(S.profil.weightKg,70), jam=(rec.bergerakMs/1000)/3600;
  if(!jam) return 0;
  var kec=rec.jarak/jam, met;
  if(rec.tipe==='Bersepeda') met = kec<16?4:(kec<22?8:10);
  else if(rec.tipe==='Jalan Kaki') met = kec<5?3:4.3;
  else met = kec<8?6:(kec<11?9.8:12.8);
  return Math.round(met*berat*jam);
}

function perbaruiTampilanRec(){
  var g=function(id){ return document.getElementById(id); };
  var e;
  if((e=g('recJam'))) e.textContent=fmtDurasi(rec.bergerakMs/1000);
  if((e=g('recJarak'))) e.textContent=rec.jarak.toFixed(2);
  if((e=g('recLaju'))){
    e.textContent = rec.tipe==='Bersepeda'
      ? rec.kecKini.toFixed(1)
      : fmtPace(rec.jarak>0 ? (rec.bergerakMs/1000)/rec.jarak : 0);
  }
  if((e=g('recStatus'))) e.textContent=labelStatusRec();

  // innerHTML hanya ditulis bila isinya benar-benar berubah. Menulis ulang tiap
  // detik membuat elemen tidak pernah diam: teks tidak bisa disorot, dan tombol
  // di dekatnya ikut bergeser saat hendak ditekan.
  setBilaBerubah(g('recJeda'), ringkasanJedaRec());
  // Kartu split hanya disusun ulang ketika satu kilometer genap bertambah.
  // Di antara itu, hanya tiga angka pada baris berjalan yang diperbarui —
  // menulis ulang seluruh kartu tiap detik membuat halaman tidak pernah diam:
  // teks tidak bisa disorot dan posisi tombol bergeser saat hendak ditekan.
  var kotakSplit=g('recSplit');
  if(kotakSplit){
    if(splitTerakhir!==rec.split.length || !g('spPace')){
      splitTerakhir=rec.split.length;
      kotakSplit.innerHTML=kartuSplit(rec.split, rec.jarak, rec.bergerakMs/1000,
        rec.patokanKm, rec.patokanDetik);
    } else {
      perbaruiSplitBerjalan();
    }
  }

  var stat=document.querySelectorAll('.rekam-utama .stat .nilai');
  if(stat.length>=4){
    stat[0].textContent='+'+Math.round(rec.naik)+' m';
    stat[1].textContent=rb(kalRec());
    stat[2].textContent=fmtDurasi(rec.totalMs/1000);
    stat[3].textContent=rec.hrList.length ? (rec.hrList[rec.hrList.length-1]+' bpm') : '—';
  }
}

/* ================================================================
   MENJAGA PEREKAMAN TETAP HIDUP

   Peramban tidak memiliki API lokasi latar belakang. Begitu layar terkunci,
   sistem membekukan halaman: pencacah waktu berhenti dan watchPosition tidak
   lagi memanggil balik. Tidak ada cara menembusnya dari halaman web — itulah
   sebabnya Strava dan Huawei Health berupa aplikasi native.

   Yang bisa dilakukan, dan dilakukan di sini:
     1. Wake Lock dipasang ulang setiap halaman kembali terlihat. Sistem selalu
        melepas kunci layar saat halaman tersembunyi, jadi tanpa pemasangan
        ulang kunci itu hilang untuk selamanya setelah sekali berpindah aplikasi.
     2. Mode layar redup: layar tetap menyala (kunci layar tetap sah) tetapi
        hampir seluruhnya hitam, sehingga pemakaian baterai turun jauh pada
        layar OLED dan tidak ada yang menyilaukan di dalam saku.
     3. Nada hening berulang menaikkan prioritas halaman di Android sehingga
        pembekuan tertunda saat berpindah aplikasi. Ini tidak menolong ketika
        layar benar-benar terkunci.
     4. Keadaan rekaman disimpan ke localStorage tiap beberapa detik, sehingga
        sesi tetap bisa dilanjutkan bila peramban menutup halaman.
   ================================================================ */

var penjagaAudio=null, pendengarRedup=false;

function kunciLayar(){
  mintaWakeLock();
  if(!pendengarRedup){
    pendengarRedup=true;
    document.addEventListener('visibilitychange', saatTampilBerubah);
    window.addEventListener('pageshow', saatTampilBerubah);
  }
}

function mintaWakeLock(){
  try{
    if(navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(function(w){
        wakeLock=w;
        if(w && w.addEventListener) w.addEventListener('release', function(){ wakeLock=null; });
      }).catch(function(){ wakeLock=null; });
    }
  }catch(e){ wakeLock=null; }
}

/**
 * Dipanggil saat halaman kembali terlihat. Dua hal dikerjakan: memasang ulang
 * kunci layar yang dilepas sistem, dan menghitung lamanya halaman tersembunyi
 * supaya pembekuan yang tidak sempat tertangkap pencacah tetap tercatat.
 */
function saatTampilBerubah(){
  if(document.visibilityState!=='visible') return;
  if(!sedangMerekam()) return;

  mintaWakeLock();

  var kini=Date.now();
  var dt=kini-(rec.tikTerakhir||kini);
  if(dt>5000 && rec.status==='jalan'){
    catatJedaRekam(kini-dt, dt);
    rec.totalMs+=dt;
    rec.putusBerikut=true;
    rec.diamSejak=0; rec.kecKini=0;
  }
  rec.tikTerakhir=kini;

  // watchPosition kerap mati bersama pembekuan; dipasang ulang agar titik
  // kembali masuk tanpa pengguna harus menyentuh apa pun.
  if(rec.status==='jalan') mulaiWatch();
  perbaruiTampilanRec();
}

function nyalakanPenjaga(){
  if(penjagaAudio) return;
  try{
    // WAV hening 1 detik; diputar berulang agar Android menganggap halaman
    // masih aktif dan menunda pembekuan saat berpindah aplikasi.
    var a=document.createElement('audio');
    a.loop=true; a.volume=0.001; a.setAttribute('playsinline','');
    a.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';
    var janji=a.play();
    if(janji && janji.catch) janji.catch(function(){});
    penjagaAudio=a;
  }catch(e){ penjagaAudio=null; }
}

function matikanPenjaga(){
  try{ if(penjagaAudio){ penjagaAudio.pause(); penjagaAudio.src=''; } }catch(e){}
  penjagaAudio=null;
}

function lepasLayar(){
  try{ if(wakeLock && wakeLock.release){ wakeLock.release(); } }catch(e){}
  wakeLock=null;
}

/* ---------------------------------------------------------------- layar redup */

function modeRedup(){
  if(document.getElementById('layarRedup')) return;
  document.getElementById('modalHost').insertAdjacentHTML('beforeend',
    '<div class="redup" id="layarRedup" onclick="keluarRedup()">'+
      '<div class="r-jam" id="redupJam">'+fmtDurasi(rec.bergerakMs/1000)+'</div>'+
      '<div class="r-jarak" id="redupJarak">'+rec.jarak.toFixed(2)+'</div>'+
      '<div class="r-sat">KILOMETER</div>'+
      '<div class="r-ket"><span class="r-titik"></span>Merekam · ketuk untuk kembali<br>'+
        'Layar tetap menyala agar GPS terus berjalan</div>'+
    '</div>');
  mintaWakeLock();
  toast('Layar diredupkan, perekaman tetap berjalan','ok');
}

function keluarRedup(){
  var el=document.getElementById('layarRedup');
  if(el && el.parentNode) el.parentNode.removeChild(el);
}

function perbaruiRedup(){
  var a=document.getElementById('redupJam'); if(!a) return;
  a.textContent=fmtDurasi(rec.bergerakMs/1000);
  var b=document.getElementById('redupJarak');
  if(b) b.textContent=rec.jarak.toFixed(2);
}

/* ---------------------------------------------------------------- pemulihan sesi */

/** Menyimpan keadaan rekaman, dibatasi sekali tiap 4 detik agar tidak boros. */
function simpanStatusRekam(paksa){
  if(!sedangMerekam()) return;
  var kini=Date.now();
  if(!paksa && kini-rec.simpanTerakhir<4000) return;
  rec.simpanTerakhir=kini;
  simpan(K.REKAM, {
    versi:1, disimpanPada:kini,
    tipe:rec.tipe, ruteId:rec.ruteId, status:rec.status,
    mulaiMs:rec.mulaiMs, totalMs:rec.totalMs, bergerakMs:rec.bergerakMs,
    jarak:rec.jarak, naik:rec.naik, turun:rec.turun,
    jejak:rec.jejak, split:rec.split, jeda:rec.jeda,
    patokanKm:rec.patokanKm, patokanDetik:rec.patokanDetik, patokanNaik:rec.patokanNaik,
    kecMaks:rec.kecMaks, hrList:rec.hrList
  });
}

function hapusStatusRekam(){
  try{ localStorage.removeItem(K.REKAM); }catch(e){}
}

/** Dipanggil sekali saat aplikasi dimuat. Menawarkan melanjutkan sesi tertunda. */
function periksaRekamTertunda(){
  var d=baca(K.REKAM, null);
  if(!d || !d.mulaiMs) return;

  var umurJam=(Date.now()-n(d.disimpanPada))/3600000;
  if(umurJam>12 || n(d.jarak)<0.03){ hapusStatusRekam(); return; }

  var menit=Math.round(n(d.totalMs)/60000);
  bukaModal('Lanjutkan Rekaman?',
    '<p class="kecil">Ada sesi <b>'+esc(d.tipe||'Lari')+'</b> yang belum diselesaikan. '+
      'Aplikasi kemungkinan ditutup sistem di tengah perekaman.</p>'+
    '<div class="grid g2" style="margin:12px 0">'+
      kartuStat('Jarak', n(d.jarak).toFixed(2)+' km')+
      kartuStat('Waktu', fmtDurasi(n(d.bergerakMs)/1000))+
    '</div>'+

function muatKeRec(d){
  rec.tipe=d.tipe||'Lari'; rec.ruteId=d.ruteId||'';
  rec.mulaiMs=n(d.mulaiMs); rec.totalMs=n(d.totalMs); rec.bergerakMs=n(d.bergerakMs);
  rec.jarak=n(d.jarak); rec.naik=n(d.naik); rec.turun=n(d.turun);
  rec.jejak=d.jejak||[]; rec.split=d.split||[]; rec.jeda=d.jeda||[];
  rec.patokanKm=n(d.patokanKm); rec.patokanDetik=n(d.patokanDetik); rec.patokanNaik=n(d.patokanNaik);
  rec.kecMaks=n(d.kecMaks); rec.hrList=d.hrList||[];
  rec.kecKini=0; rec.diamSejak=0; rec.autoJeda=false; rec.altTerakhir=null;
}

function lanjutkanRekamTertunda(){
  var d=baca(K.REKAM, null); if(!d) return tutupModal();
  tutupModal();
  muatKeRec(d);

  // Waktu sejak penyimpanan terakhir dicatat sebagai jeda, bukan waktu bergerak.
  var hilang=Date.now()-n(d.disimpanPada);
  if(hilang>5000){
    rec.totalMs+=hilang;
    rec.jeda.push({mulai:Math.round((n(d.disimpanPada)-rec.mulaiMs)/1000), detik:Math.round(hilang/1000)});
  }
  rec.putusBerikut=true;
  rec.status='jalan'; rec.tikTerakhir=Date.now();

  mulaiWatch();
  if(idTimerRec) clearInterval(idTimerRec);
  idTimerRec=setInterval(tikRekam, 1000);
  kunciLayar(); nyalakanPenjaga();
  tab='peta'; subPeta='rekam';
  renderPaksa();
  toast('Rekaman dilanjutkan · '+fmtDurasi(totalJedaDetik(rec.jeda))+' tidak terekam','info');
}

function simpanRekamTertunda(){
  var d=baca(K.REKAM, null); if(!d) return tutupModal();
  tutupModal();
  muatKeRec(d);
  rec.status='selesai';
  tab='peta'; subPeta='rekam';
  modalSimpanSesi();
}

/**
 * Memecah jejak menjadi beberapa ruas pada titik yang ditandai putus, yaitu
 * titik pertama setelah halaman dibekukan sistem. Menggambar satu garis lurus
 * menembus celah itu akan menampilkan jalur yang tidak pernah ditempuh.
 */
function ruasJejak(jejak){
  var ruas=[], kini=[];
  (jejak||[]).forEach(function(t){
    if(t.putus && kini.length){ ruas.push(kini); kini=[]; }
    kini.push([n(t.lat), n(t.lng)]);
  });
  if(kini.length) ruas.push(kini);
  return ruas.filter(function(r){ return r.length>1; });
}

function gambarJejakRec(){
  if(!petaObj || !window.L || rec.jejak.length<2) return;
  if(lapisanRec) petaObj.removeLayer(lapisanRec);
  var ruas=ruasJejak(rec.jejak);
  if(!ruas.length) return;
  lapisanRec=L.layerGroup(ruas.map(function(r){
    return L.polyline(r,{color:'#fc5200', weight:5, opacity:.92});
  })).addTo(petaObj);
}

  var k = tipe==='Bersepeda' ? 'Gowes' : (tipe==='Jalan Kaki' ? 'Jalan Santai' : 'Lari');
  return k+' '+w;
}

function simpanSesi(){
  var detik=Math.round(rec.bergerakMs/1000);
  var jejak=sederhanakanJejak(rec.jejak, 0.000045);
  var split=rec.split.slice();
  var sisa=rec.jarak-rec.patokanKm;
  if(sisa>0.05){
    split.push({km:Math.round(rec.jarak*100)/100, detik:Math.round(detik-rec.patokanDetik),
                naik:Math.round(rec.naik-rec.patokanNaik), sebagian:true});
  }

  var s={
    id:idBaru('ses'), tanggal:hariIni(), jam:jamKini(), tipe:rec.tipe,
    judul:(document.getElementById('ssJudul').value||'').trim() || judulOtomatis(rec.tipe),
    ruteId:rec.ruteId||'',
    durasiDetik:Math.round(rec.totalMs/1000),
    bergerakDetik:detik,
    jarakKm:Math.round(rec.jarak*100)/100,
    elevasiNaik:Math.round(rec.naik), elevasiTurun:Math.round(rec.turun),
    kalori:kalRec(),
    paceRata: rec.jarak>0 ? Math.round(detik/rec.jarak) : 0,
    kecepatanMaks:Math.round(rec.kecMaks*10)/10,
    hrRata: rec.hrList.length ? Math.round(rec.hrList.reduce(function(a,b){return a+b;},0)/rec.hrList.length) : 0,
    hrMaks: rec.hrList.length ? Math.max.apply(null, rec.hrList) : 0,
    jejak:jejak, split:split, jeda:rec.jeda.slice(),
    catatan:(document.getElementById('ssCatat').value||'').trim()
  };

  var klien={
    id:s.id, date:s.tanggal, time:s.jam, type:s.tipe, title:s.judul, routeId:s.ruteId,
    elapsedSeconds:s.durasiDetik, movingSeconds:s.bergerakDetik, distanceKm:s.jarakKm,
    elevGain:s.elevasiNaik, elevLoss:s.elevasiTurun, calories:s.kalori, avgPace:s.paceRata,
    maxSpeed:s.kecepatanMaks, avgHr:s.hrRata, maxHr:s.hrMaks,
    track:jejak, splits:split, notes:s.catatan, gaps:s.jeda
  };

  tutupModal();
  ubah('sesi_simpan', s, function(){
    S.sesi=S.sesi||[];
    S.sesi.unshift(klien);
    var a=aktivitasHari(s.tanggal);
    a.activeCalories=n(a.activeCalories)+s.kalori;
    a.distanceKm=Math.round((n(a.distanceKm)+s.jarakKm)*100)/100;
    S.aktivitas=(S.aktivitas||[]).filter(function(x){ return x.date!==s.tanggal; });
    S.aktivitas.push(a);
    S.profil.userXp=n(S.profil.userXp)+25;
    S.profil.userLevel=Math.floor(n(S.profil.userXp)/500)+1;
  });

  resetRekam();
  subPeta='aktivitas'; sesiTerbuka=klien.id;
  renderPaksa();
  toast('Aktivitas tersimpan · '+s.jarakKm.toFixed(2)+' km','ok');
}

/* Penyederhanaan Ramer–Douglas–Peucker supaya jejak muat di satu sel Sheets.
   RDP bekerja pada bidang datar lintang-bujur, jadi lintasan lurus yang
   menanjak akan ikut terbuang dan profil elevasinya hilang. Karena itu titik
   dengan perubahan ketinggian berarti ditandai untuk dipertahankan juga. */
function sederhanakanJejak(jejak, eps){
  if(jejak.length<=2) return jejak.slice();
  var kerja=jejak;
  if(kerja.length>2000) kerja=jarangkan(kerja, 2000);

  var simpan={};
  tandaiRdp(kerja, 0, kerja.length-1, eps, simpan);

  var acuan=null;
  for(var i=0;i<kerja.length;i++){
    var a=kerja[i] ? kerja[i].alt : null;
    if(a===null || a===undefined) continue;
    if(acuan===null || Math.abs(a-acuan)>=3){ simpan[i]=true; acuan=a; }
  }

  // Titik penanda putus wajib bertahan: ia yang memberi tahu peta dan kartu
  // bagikan di mana jejak harus dipotong, bukan disambung.
  for(var q=0;q<kerja.length;q++) if(kerja[q] && kerja[q].putus) simpan[q]=true;

  var hasil=[];
  for(var k=0;k<kerja.length;k++) if(simpan[k]) hasil.push(kerja[k]);
  if(hasil.length>400) hasil=jarangkan(hasil, 400);
  return hasil;
}

function jarangkan(a, maks){
  if(a.length<=maks) return a.slice();

  // Titik putus tidak boleh ikut terbuang saat penjarangan.
  var wajib={};
  for(var w=0;w<a.length;w++) if(a[w] && a[w].putus) wajib[w]=true;
  wajib[0]=true; wajib[a.length-1]=true;

  var sisa=maks-Object.keys(wajib).length;
  if(sisa>0){
    var langkah=a.length/(sisa+1);
    for(var i=1;i<=sisa;i++) wajib[Math.floor(i*langkah)]=true;
  }
  var out=[];
  for(var k=0;k<a.length;k++) if(wajib[k]) out.push(a[k]);
  return out;
}

/** Menandai indeks titik yang harus dipertahankan (varian RDP tanpa salinan array). */
function tandaiRdp(t, i, j, eps, simpan){
  simpan[i]=true; simpan[j]=true;
  var maks=0, idx=-1;
  for(var k=i+1;k<j;k++){
    var d=jarakKeGaris(t[k], t[i], t[j]);
    if(d>maks){ maks=d; idx=k; }
  }
  if(maks>eps && idx>i){
    tandaiRdp(t, i, idx, eps, simpan);
    tandaiRdp(t, idx, j, eps, simpan);
  }
}

function jarakKeGaris(p, a, b){
  var dx=b.lng-a.lng, dy=b.lat-a.lat;
  var pj=dx*dx+dy*dy;
  var u = pj ? (((p.lng-a.lng)*dx + (p.lat-a.lat)*dy)/pj) : 0;
  u=Math.max(0, Math.min(1, u));
  var cx=a.lng+u*dx, cy=a.lat+u*dy;
  return Math.sqrt((p.lng-cx)*(p.lng-cx) + (p.lat-cy)*(p.lat-cy));
}

}

function pasangPetaSesi(){
  var s=(S.sesi||[]).filter(function(x){ return x.id===sesiTerbuka; })[0];
  if(!s) return;
  var tk=(s.track||[]).map(function(t){ return [n(t.lat), n(t.lng)]; })
    .filter(function(t){ return t[0] || t[1]; });

  muatLeaflet(function(ok){
    var el=document.getElementById('peta'); if(!el) return;
    if(!ok || tk.length<2){
      el.innerHTML='<div class="kosong" style="padding:34px 16px"><span class="ik">🗺️</span>'+
        (tk.length<2 ? 'Sesi ini tidak menyimpan jejak GPS.' : 'Peta butuh koneksi internet.')+
        '<div class="kecil" style="margin-top:6px">Semua angka statistik di bawah tetap tersedia.</div></div>';
      return;

    try{
      if(petaObj){ try{ petaObj.remove(); }catch(e){} }
      petaObj=L.map(el,{zoomControl:true}).setView(tk[0], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

      })).addTo(petaObj);
      petaObj.fitBounds(L.latLngBounds(tk),{padding:[26,26]});
      // Celah antar-ruas digambar putus-putus agar jelas bahwa bagian itu

        .addTo(petaObj).bindPopup('Finish');
      setTimeout(function(){ if(petaObj) petaObj.invalidateSize(); }, 220);
    }catch(e){
      el.innerHTML='<div class="kosong">Gagal memuat peta: '+esc(e.message)+'</div>';
    }
  });
}

/* ---------------------------------------------------------------- split & elevasi */

function kartuSplit(splits, jarakKini, detikKini, patokanKm, patokanDetik){
  var daftar=(splits||[]).slice();

  // kilometer yang sedang berjalan ikut ditampilkan sebagai bar bergaris
  if(jarakKini!==undefined && patokanKm!==undefined){
    var sisa=jarakKini-patokanKm;
    if(sisa>0.03){
      daftar.push({km:Math.round(jarakKini*100)/100,
                   detik:Math.round(detikKini-patokanDetik),
                   naik:0, sebagian:true});
    }
  }
  if(!daftar.length) return '';

  var penuh=daftar.filter(function(s){ return !s.sebagian; });
  var maks=1, min=1e9;
  penuh.forEach(function(s){ if(n(s.detik)>maks) maks=n(s.detik); if(n(s.detik)<min) min=n(s.detik); });
  if(!penuh.length){ maks=Math.max(1, n(daftar[0].detik)); min=maks; }

  return '<div class="kartu"><h3>Split per Kilometer</h3>'+
    daftar.map(function(s){
      var lebar=Math.max(10, Math.min(100, Math.round(n(s.detik)/maks*100)));
      var kelas = s.sebagian ? 'sebagian' : ((penuh.length>1 && n(s.detik)===min) ? 'tercepat' : '');
      // Baris kilometer berjalan diberi id supaya angkanya bisa diperbarui
      // tiap detik tanpa menyusun ulang seluruh kartu.
      var id = s.sebagian ? ' id="spKm"' : '';
      var idB = s.sebagian ? ' id="spBar"' : '';
      var idP = s.sebagian ? ' id="spPace"' : '';
      return '<div class="split-baris">'+
        '<div class="split-km"'+id+'>'+(s.sebagian ? n(s.km).toFixed(2) : n(s.km))+'</div>'+
        '<div class="split-bar"><i class="'+kelas+'"'+idB+' style="width:'+lebar+'%"></i></div>'+
        '<div class="split-pace"'+idP+'>'+fmtPace(s.detik)+'</div>'+
        '<div class="split-elev">'+(n(s.naik) ? '+'+n(s.naik)+' m' : '—')+'</div>'+
      '</div>';
    }).join('')+
    '<p class="kecil" style="margin-top:8px">Panjang bar adalah waktu tiap kilometer dibanding kilometer terlambat — makin pendek berarti makin cepat. Bar bergaris adalah kilometer yang belum genap.</p>'+
  '</div>';
}

function kartuElevasi(track){
  var alt=(track||[]).map(function(t){ return n(t.alt); }).filter(function(a){ return a>0; });
  if(alt.length<4) return '';
  var lo=Math.min.apply(null, alt), hi=Math.max.apply(null, alt);
  var rentang=Math.max(1, hi-lo);
  var contoh=jarangkan(alt, Math.min(64, alt.length));
  return '<div class="kartu"><h3>Profil Elevasi</h3>'+
    '<div class="baris rata"><span class="kecil">Terendah '+Math.round(lo)+' m</span>'+
      '<span class="kecil">Tertinggi '+Math.round(hi)+' m</span></div>'+
    '<div class="elev-grafik">'+
      contoh.map(function(a){
        var t=Math.max(4, Math.round((a-lo)/rentang*100));
        return '<i style="height:'+t+'%"></i>';
      }).join('')+
    '</div>'+
    '<p class="kecil" style="margin-top:7px">Elevasi diambil dari GPS perangkat. Banyak ponsel tidak punya barometer, jadi angkanya bisa meleset beberapa meter dan sebaiknya dibaca sebagai gambaran naik-turun, bukan ukuran pasti.</p>'+
  '</div>';
}

/* ---------------------------------------------------------------- rekor pribadi */

function rekorKm(list, targetKm){
  var terbaik=null;
  list.forEach(function(s){
    var sp=(s.splits||[]).filter(function(x){ return !x.sebagian; });
    if(sp.length<targetKm) return;
    var total=0;
    for(var i=0;i<targetKm;i++) total+=n(sp[i].detik);
    if(total>0 && (!terbaik || total<terbaik.detik)) terbaik={detik:total, sesi:s};
  });
  return terbaik;
}

function kartuRekor(list){
  if(!list.length) return '';
  var lari=list.filter(function(s){ return s.type!=='Bersepeda'; });
  var r1=rekorKm(lari,1), r5=rekorKm(lari,5), r10=rekorKm(lari,10);

  var terjauh=null, terlama=null, tertinggi=null, totalKal=0;
  list.forEach(function(s){
    if(!terjauh || n(s.distanceKm)>n(terjauh.distanceKm)) terjauh=s;
    if(!terlama || n(s.movingSeconds)>n(terlama.movingSeconds)) terlama=s;
    if(!tertinggi || n(s.elevGain)>n(tertinggi.elevGain)) tertinggi=s;
    totalKal+=n(s.calories);
  });

  var petak=[];
  if(r1) petak.push(['1 km tercepat', fmtDurasi(r1.detik), r1.sesi.date]);
  if(r5) petak.push(['5 km tercepat', fmtDurasi(r5.detik), r5.sesi.date]);
  if(r10) petak.push(['10 km tercepat', fmtDurasi(r10.detik), r10.sesi.date]);
  if(terjauh) petak.push(['Jarak terjauh', n(terjauh.distanceKm).toFixed(2)+' km', terjauh.date]);
  if(terlama) petak.push(['Durasi terlama', fmtDurasi(terlama.movingSeconds), terlama.date]);
  if(tertinggi && n(tertinggi.elevGain)) petak.push(['Elevasi terbanyak', '+'+n(tertinggi.elevGain)+' m', tertinggi.date]);

  var h='<div class="kartu"><h3>Rekor Pribadi</h3>'+
    '<div class="grid g2">'+
      kartuStat('Total sesi', list.length)+
      kartuStat('Total jarak', totalJarakSesi(list).toFixed(1)+' km')+
    '</div>';

  if(petak.length){
    h+='<div class="grid g2" style="margin-top:9px">'+
      petak.map(function(p){
        return '<div class="rekor-petak"><div class="r-label">'+esc(p[0])+'</div>'+
          '<div class="r-nilai">'+esc(String(p[1]))+'</div>'+
          '<div class="r-ket">'+esc(p[2])+'</div></div>';
      }).join('')+'</div>';
  } else {
    h+='<p class="kecil" style="margin-top:9px">Rekor kecepatan per jarak muncul setelah ada sesi yang menembus satu kilometer penuh.</p>';
  }

  h+=rekorPerRute(list);
  h+='<p class="kecil" style="margin-top:9px">Total pembakaran dari seluruh sesi: '+rb(totalKal)+' kkal.</p></div>';
  return h;
}

function rekorPerRute(list){
  var per={};
  list.forEach(function(s){
    if(!s.routeId) return;
    if(!per[s.routeId] || n(s.movingSeconds)<n(per[s.routeId].movingSeconds)) per[s.routeId]=s;
  });
  var kunci=Object.keys(per);
  if(!kunci.length) return '';
  return '<div style="margin-top:12px"><div class="kecil" style="font-weight:700; margin-bottom:5px">Waktu terbaik per rute</div>'+
    kunci.map(function(k){
      var s=per[k];
      return '<div class="baris rata" style="padding:5px 0; border-bottom:1px solid var(--garis)">'+
        '<span class="kecil">'+esc(namaRute(k))+'</span>'+
        '<span class="kecil"><b>'+fmtDurasi(s.movingSeconds)+'</b> · '+n(s.distanceKm).toFixed(2)+' km</span></div>';
    }).join('')+'</div>';
}

/* ---------------------------------------------------------------- aksi sesi */

function hapusSesi(id){
  var s=(S.sesi||[]).filter(function(x){ return x.id===id; })[0];
  if(!s) return;
  if(!confirm('Hapus aktivitas "'+(s.title||s.type)+'"? Jejak GPS-nya ikut terhapus.')) return;
  sesiTerbuka=null;
  ubah('sesi_hapus', {id:id}, function(){
    S.sesi=(S.sesi||[]).filter(function(x){ return x.id!==id; });
    var a=aktivitasHari(s.date);
    a.activeCalories=Math.max(0, n(a.activeCalories)-n(s.calories));
    a.distanceKm=Math.round(Math.max(0, n(a.distanceKm)-n(s.distanceKm))*100)/100;
    S.aktivitas=(S.aktivitas||[]).filter(function(x){ return x.date!==s.date; });
    S.aktivitas.push(a);
  });
  toast('Aktivitas dihapus','ok');
}

function bagikanSesi(id){
  var s=(S.sesi||[]).filter(function(x){ return x.id===id; })[0];
  if(!s) return;
  var p=S.profil||{};
  var laju = s.type==='Bersepeda'
    ? ((n(s.distanceKm)/(n(s.movingSeconds)/3600))||0).toFixed(1)+' km/jam'
    : fmtPace(s.avgPace)+' /km';
  var post={
    id:idBaru('cp'), authorName:p.name||'Saya',
    authorAvatar:(p.name||'S').substring(0,1).toUpperCase(),
    authorBadge:'Level '+n(p.userLevel,1), timestamp:'Baru saja',
    content:ikonTipe(s.type)+' '+(s.title||s.type)+' — '+n(s.distanceKm).toFixed(2)+' km dalam '+
            fmtDurasi(s.movingSeconds)+' (pace '+laju+'), '+rb(s.calories)+' kkal.',
    likesCount:0, commentsCount:0, userLiked:false, mealShared:null,
    workoutShared:{type:s.type, distanceKm:n(s.distanceKm), durationMinutes:Math.round(n(s.movingSeconds)/60)}
  };
  ubah('komunitas_post', post, function(){ S.komunitas=S.komunitas||[]; S.komunitas.push(post); });
  toast('Aktivitas dibagikan ke Komunitas','ok');
}

  var c=document.getElementById('kanvasBagi'); if(!c || !bagiSesi) return;

  var W=c.width, H=c.height, s=bagiSesi, T=TEMA_BAGI[bagiTema]||TEMA_BAGI.malam;

    if(bagiFoto){
      x.save(); x.globalAlpha=.3; gambarFotoPenuh(x, bagiFoto, W, H); x.restore();
    }

  var M=86;
  x.textBaseline='alphabetic';

  /* kepala: jenis olahraga + tanggal */

  x.font='700 42px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  x.textAlign='left';
  x.fillText(labelOlahraga(s.type), M, 150);

  x.fillStyle=T.redup;
  x.font='500 34px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  x.fillText(tanggalPanjang(s.date)+' · '+(s.time||''), M, 204);

  /* angka utama: jarak */
  x.fillStyle=T.teks;
  x.textAlign='left';
  x.font='800 230px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  var jarakTeks=n(s.distanceKm).toFixed(2);
  x.fillText(jarakTeks, M-8, 470);

  var lebarJarak=x.measureText(jarakTeks).width;
  x.fillStyle=T.redup;
  x.font='700 46px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  x.fillText('km', M+lebarJarak+6, 470);

  x.fillStyle=T.redup;
  x.font='600 32px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  x.fillText('JARAK TEMPUH', M, 524);

  /* jalur rute */
  var kotak={x:M, y:596, w:W-M*2, h:520};
  var adaJalur=gambarJalurKanvas(x, s, kotak, T);
  if(!adaJalur){
    x.fillStyle=T.redup;
    x.font='500 34px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    x.textAlign='center';
    x.fillText('Sesi ini tidak menyimpan jejak GPS', W/2, kotak.y+kotak.h/2);
    x.textAlign='left';
