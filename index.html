  /* tiga metrik pendukung */
  var laju = s.type==='Bersepeda'
    ? ((n(s.distanceKm)/(n(s.movingSeconds)/3600))||0).toFixed(1)
    : fmtPace(s.avgPace);
  var labelLaju = s.type==='Bersepeda' ? 'KM/JAM' : 'PACE /KM';

  var metrik=[
    [fmtDurasi(s.movingSeconds), 'DURASI'],
    [laju, labelLaju],
    [String(rb(s.calories)), 'KALORI']
  ];
  var yM=1330;
  var lebarKolom=(W-M*2)/3;
  x.textAlign='center';
  metrik.forEach(function(m,i){
    var cx=M+lebarKolom*i+lebarKolom/2;
    x.fillStyle=T.teks;
    x.font='800 76px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    x.fillText(m[0], cx, yM);
    x.fillStyle=T.redup;
    x.font='600 28px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
    x.fillText(m[1], cx, yM+46);
  });

  /* baris kedua: elevasi & detak bila ada */
  var tambahan=[];
  if(n(s.elevGain)) tambahan.push(['+'+n(s.elevGain)+' m','ELEVASI']);
  if(n(s.avgHr)) tambahan.push([n(s.avgHr)+' bpm','DETAK RATA²']);
  if((s.gaps||[]).length) tambahan.push([fmtDurasi(totalJedaDetik(s.gaps)),'TIDAK TEREKAM']);
  if(tambahan.length){
    var yT=1470, lk=(W-M*2)/tambahan.length;
    tambahan.forEach(function(m,i){
      var cx=M+lk*i+lk/2;
      x.fillStyle=T.teks;
      x.font='700 48px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      x.fillText(m[0], cx, yT);
      x.fillStyle=T.redup;
      x.font='600 25px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
      x.fillText(m[1], cx, yT+40);
    });
  }

  /* garis pemisah + kaki kartu */
  x.strokeStyle=T.redup; x.globalAlpha=.35;
  x.lineWidth=2; x.beginPath(); x.moveTo(M,1620); x.lineTo(W-M,1620); x.stroke();
  x.globalAlpha=1;

  x.textAlign='left';
  x.fillStyle=T.teks;
  x.font='700 40px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  x.fillText(((S.profil||{}).name)||'NutriFit ID', M, 1708);

  x.fillStyle=T.redup;
  x.font='500 30px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  x.fillText(esc(s.title||s.type).replace(/&[a-z#0-9]+;/g,''), M, 1756);

  x.textAlign='right';
  x.fillStyle=T.aksen;
  x.font='800 36px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  x.fillText('NutriFit ID', W-M, 1708);
  x.fillStyle=T.redup;
  x.font='500 26px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  x.fillText('Direkam dengan GPS', W-M, 1752);
  x.textAlign='left';
}

/** Menggambar foto menutupi seluruh kanvas tanpa menggepengkan rasio. */
function gambarFotoPenuh(x, img, W, H){
  var r=Math.max(W/img.width, H/img.height);
  var w=img.width*r, h=img.height*r;
  x.drawImage(img, (W-w)/2, (H-h)/2, w, h);
}

/**
 * Menggambar jejak GPS di dalam kotak yang diberikan. Ruas yang terputus
 * digambar terpisah, dan celahnya putus-putus, sama seperti di peta.
 */
function gambarJalurKanvas(x, s, kotak, T){
  var ruas=ruasJejak(s.track||[]);
  if(!ruas.length) return false;

  var semua=[];
  ruas.forEach(function(r){ r.forEach(function(t){ semua.push(t); }); });

  var laMin=1e9, laMaks=-1e9, lnMin=1e9, lnMaks=-1e9;
  semua.forEach(function(t){
    if(t[0]<laMin) laMin=t[0]; if(t[0]>laMaks) laMaks=t[0];
    if(t[1]<lnMin) lnMin=t[1]; if(t[1]>lnMaks) lnMaks=t[1];
  });

  // Bujur dimampatkan sesuai lintang supaya bentuk jalur tidak melar
  // ke samping — satu derajat bujur lebih pendek daripada satu derajat lintang.
  var kosLat=Math.cos((laMin+laMaks)/2*Math.PI/180) || 1;
  var lebarGeo=Math.max((lnMaks-lnMin)*kosLat, 1e-7);
  var tinggiGeo=Math.max(laMaks-laMin, 1e-7);
  var skala=Math.min(kotak.w/lebarGeo, kotak.h/tinggiGeo);
  var offX=kotak.x+(kotak.w-lebarGeo*skala)/2;
  var offY=kotak.y+(kotak.h-tinggiGeo*skala)/2;

  function ke(t){
    return [offX+(t[1]-lnMin)*kosLat*skala,
            offY+(laMaks-t[0])*skala];   // lintang dibalik: utara di atas
  }

  x.save();
  x.lineJoin='round'; x.lineCap='round';

  // celah antar-ruas
  x.strokeStyle=T.redup; x.lineWidth=5; x.setLineDash([14,16]);
  for(var i=1;i<ruas.length;i++){
    var a=ke(ruas[i-1][ruas[i-1].length-1]), b=ke(ruas[i][0]);
    x.beginPath(); x.moveTo(a[0],a[1]); x.lineTo(b[0],b[1]); x.stroke();
  }
  x.setLineDash([]);

  // bayangan tipis agar jalur terbaca di atas foto apa pun
  x.strokeStyle='rgba(0,0,0,.28)'; x.lineWidth=18;
  ruas.forEach(function(r){
    x.beginPath();
    r.forEach(function(t,j){ var p=ke(t); if(j===0) x.moveTo(p[0],p[1]); else x.lineTo(p[0],p[1]); });
    x.stroke();
  });

  x.strokeStyle=T.jalur; x.lineWidth=11;
  ruas.forEach(function(r){
    x.beginPath();
    r.forEach(function(t,j){ var p=ke(t); if(j===0) x.moveTo(p[0],p[1]); else x.lineTo(p[0],p[1]); });
    x.stroke();
  });

  // penanda start dan finish
  var awal=ke(ruas[0][0]);
  var ujungRuas=ruas[ruas.length-1];
  var akhir=ke(ujungRuas[ujungRuas.length-1]);
  [[awal,'#22c55e'],[akhir,'#ef4444']].forEach(function(t){
    x.beginPath(); x.arc(t[0][0], t[0][1], 20, 0, Math.PI*2);
    x.fillStyle=t[1]; x.fill();
    x.lineWidth=7; x.strokeStyle='#ffffff'; x.stroke();
  });

  x.restore();
  return true;
}

function labelOlahraga(t){
  if(t==='Bersepeda') return 'Bersepeda';
  if(t==='Jalan Kaki') return 'Jalan Kaki';
  return 'Lari';
}

function tanggalPanjang(tgl){
  var B=['Januari','Februari','Maret','April','Mei','Juni','Juli',
         'Agustus','September','Oktober','November','Desember'];
  var p=String(tgl||'').split('-');
  if(p.length!==3) return String(tgl||'');
  return n(p[2])+' '+B[Math.max(0,Math.min(11,n(p[1])-1))]+' '+p[0];
}

/* ---------------- membagikan & menyimpan ---------------- */

function kanvasKeBlob(cb){
  var c=document.getElementById('kanvasBagi');
  if(!c) return cb(null);
  if(bagiBlob) return cb(bagiBlob);
  if(c.toBlob){
    c.toBlob(function(b){ bagiBlob=b; cb(b); }, 'image/jpeg', 0.92);
  } else {
    try{
      var d=c.toDataURL('image/jpeg',0.92).split(',')[1];
      var bin=atob(d), arr=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      bagiBlob=new Blob([arr],{type:'image/jpeg'});
      cb(bagiBlob);
    }catch(e){ cb(null); }
  }
}

function namaBerkasBagi(){
  var s=bagiSesi||{};
  return 'nutrifit-'+String(s.date||'').replace(/-/g,'')+'-'+
         n(s.distanceKm).toFixed(2).replace('.','')+'km.jpg';
}

function keteranganBagi(){
  var s=bagiSesi; if(!s) return '';
  var laju = s.type==='Bersepeda'
    ? ((n(s.distanceKm)/(n(s.movingSeconds)/3600))||0).toFixed(1)+' km/jam'
    : fmtPace(s.avgPace)+' /km';
  return labelOlahraga(s.type)+' '+n(s.distanceKm).toFixed(2)+' km dalam '+
    fmtDurasi(s.movingSeconds)+' (pace '+laju+'), '+rb(s.calories)+' kkal'+
    (n(s.elevGain) ? ', elevasi +'+n(s.elevGain)+' m' : '')+'. '+
    tanggalPanjang(s.date)+'. #NutriFitID';
}

function bagikanKartu(){
  kanvasKeBlob(function(b){
    if(!b) return toast('Gambar gagal dibuat','err');
    var berkas=null;
    try{ berkas=new File([b], namaBerkasBagi(), {type:'image/jpeg'}); }catch(e){}

    if(berkas && navigator.share && navigator.canShare && navigator.canShare({files:[berkas]})){
      navigator.share({files:[berkas], text:keteranganBagi()})
        .then(function(){ toast('Kartu dibagikan','ok'); })
        .catch(function(e){
          if(e && e.name==='AbortError') return;
          unduhKartu();
        });
      return;
    }
    // Peramban tanpa berbagi berkas: gambar disimpan supaya bisa diunggah manual.
    toast('Peramban ini belum bisa membagikan berkas langsung — gambar disimpan','info');
    unduhKartu();
  });
}

function unduhKartu(){
  kanvasKeBlob(function(b){
    if(!b) return toast('Gambar gagal dibuat','err');
    try{
      var u=URL.createObjectURL(b);
      var a=document.createElement('a');
      a.href=u; a.download=namaBerkasBagi();
      document.body.appendChild(a); a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(u); }, 1500);
      toast('Gambar tersimpan','ok');
    }catch(e){ toast('Gagal menyimpan gambar','err'); }
  });
}

function salinKeteranganBagi(){
  var teks=keteranganBagi();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(teks)
      .then(function(){ toast('Keterangan disalin','ok'); })
      .catch(function(){ toast('Gagal menyalin','err'); });
  } else {
    toast('Peramban ini tidak mendukung salin otomatis','info');
  }
}

function jadwalkanUlangSesi(id){
  var s=(S.sesi||[]).filter(function(x){ return x.id===id; })[0];
  if(!s) return;
  modalJadwal({
    title:s.title||s.type,

function simpanSebagaiRute(id){
  var s=(S.sesi||[]).filter(function(x){ return x.id===id; })[0];
  if(!s) return;
  var tk=(s.track||[]).map(function(t){ return {lat:n(t.lat), lng:n(t.lng), label:''}; })

  if(tk.length<2) return toast('Sesi ini tidak punya jejak GPS untuk dijadikan rute','err');

  var data={
    id:idBaru('rt'), name:(s.title||s.type)+' (dari rekaman)', locationName:'',

  };
  ubah('rute_simpan', data, function(){ S.rute=S.rute||[]; S.rute.push(data); });
  ruteTerpilih=data.id;
  toast('Jejak disimpan sebagai rute baru','ok');
}

/* ---------------------------------------------------------------- pemformat */

function fmtDurasi(detik){
  detik=Math.max(0, Math.round(n(detik)));
  var j=Math.floor(detik/3600), m=Math.floor((detik%3600)/60), d=detik%60;
  return j>0 ? (j+':'+pad(m)+':'+pad(d)) : (pad(m)+':'+pad(d));
}

function fmtPace(detikPerKm){
  var v=Math.round(n(detikPerKm));
  if(!v || !isFinite(v) || v>5999) return '—';
  return Math.floor(v/60)+':'+pad(v%60);
}

/** Menyeragamkan bentuk waypoint: dukung [lat,lng] maupun {lat,lng,label}. */
function titikRute(r){
  return ((r&&r.waypoints)||[]).map(function(w){
    return Array.isArray(w)
      ? {lat:n(w[0]), lng:n(w[1]), label:''}
      : {lat:n(w.lat), lng:n(w.lng), label:(w.label||'')};
  }).filter(function(t){ return t.lat || t.lng; });
}

          '<span class="chip '+(r.difficulty==='Tantangan'?'merah':(r.difficulty==='Sedang'?'oranye':''))+'">'+esc(r.difficulty||'Mudah')+'</span></div>'+
        '<p class="kecil">📍 '+esc(r.locationName||'Lokasi belum diisi')+'</p>';

    if(modeEditJalur){
      h+='<div class="kotak-edit">✏️ <b>Mode ubah jalur aktif.</b> Ketuk peta untuk menambah titik, ketuk sebuah titik untuk menghapusnya.<br>'+
          'Titik: <b id="jmlTitik">'+jalurDraft.length+'</b> · Perkiraan jarak: <b id="jarakDraft">'+panjangDraft().toFixed(2)+'</b> km</div>'+
        '<div id="peta"></div>'+
        '<div class="baris wrap" style="gap:8px; margin-top:10px">'+

        '</div>';
    } else {
      h+='<div id="peta"></div>'+
        '<div class="grid g4" style="margin-top:11px">'+
          kartuStat('Jarak', n(r.distanceKm)+' km')+
          kartuStat('Estimasi', n(r.estimatedMinutes)+' mnt')+
          kartuStat('Kalori', rb(r.caloriesBurned))+
          kartuStat('Titik', tk.length)+
        '</div>'+
        (r.description ? '<p class="kecil" style="margin-top:10px">'+esc(r.description)+'</p>' : '')+

function riwayatRute(id){
  var list=(S.sesi||[]).filter(function(s){ return s.routeId===id; });
  if(!list.length) return '';
  var terbaik=list.reduce(function(a,b){ return n(b.movingSeconds)<n(a.movingSeconds)?b:a; });
  return '<div style="margin-top:12px; border-top:1px solid var(--garis); padding-top:9px">'+
    '<div class="kecil"><b>'+list.length+'</b> aktivitas tercatat di rute ini · waktu terbaik '+
    '<b>'+fmtDurasi(terbaik.movingSeconds)+'</b> pada '+esc(terbaik.date)+'</div></div>';
}

function rekamDiRute(id){
  rec.ruteId=id;
  var r=(S.rute||[]).filter(function(x){ return x.id===id; })[0];
  if(r) rec.tipe = r.type==='Bersepeda' ? 'Bersepeda' : (r.type==='Jalan Santai' ? 'Jalan Kaki' : 'Lari');
  subPeta='rekam';
  renderPaksa();
  toast('Rute dipasang. Tekan Mulai bila sudah siap.','info');
}

function pilihRute(id){
  if(modeEditJalur) return toast('Selesaikan atau keluar dari mode ubah jalur dulu','info');
  ruteTerpilih=id; renderPaksa();
}

function pasangPetaRute(){
  var r=ruteAktif(); if(!r) return;
  muatLeaflet(function(ok){
    var el=document.getElementById('peta'); if(!el) return;

    if(!ok){
      var daftar=titikRute(r).map(function(t,i){
        return (i+1)+'. '+t.lat.toFixed(5)+', '+t.lng.toFixed(5)+(t.label?(' — '+esc(t.label)):'');
      }).join('<br>');
      el.innerHTML='<div class="kosong" style="padding:34px 16px"><span class="ik">🗺️</span>'+
        'Peta butuh koneksi internet.'+
        (daftar ? '<div class="kecil" style="margin-top:10px; text-align:left; line-height:1.7">'+daftar+'</div>'
                : '<div class="kecil" style="margin-top:8px">Rute ini belum punya titik jalur.</div>')+
        '</div>';
      return;
    }

    try{
      if(petaObj){ try{ petaObj.remove(); }catch(e){} }
      petaObj=null; lapisanRute=null; lapisanDraft=null; penandaSaya=null; penandaDraft=[];

      var tk = modeEditJalur ? jalurDraft : titikRute(r);
      var pusat = tk.length
        ? [tk[0].lat, tk[0].lng]
        : [n(r.center&&r.center.lat, -6.2), n(r.center&&r.center.lng, 106.8)];

      petaObj=L.map(el,{zoomControl:true}).setView(pusat, 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(petaObj);

      if(modeEditJalur){
        el.classList.add('menggambar');
        petaObj.on('click', function(e){ tambahTitik(e.latlng.lat, e.latlng.lng); });
        gambarDraft();
        if(tk.length>1) petaObj.fitBounds(L.latLngBounds(tk.map(function(t){ return [t.lat,t.lng]; })),{padding:[30,30]});
      } else if(tk.length>1){
        lapisanRute=L.polyline(tk.map(function(t){ return [t.lat,t.lng]; }),
          {color:'#059669', weight:5, opacity:.85}).addTo(petaObj);
        petaObj.fitBounds(lapisanRute.getBounds(),{padding:[28,28]});
        L.marker([tk[0].lat,tk[0].lng]).addTo(petaObj).bindPopup('Start');
        L.marker([tk[tk.length-1].lat,tk[tk.length-1].lng]).addTo(petaObj).bindPopup('Finish');
      } else if(tk.length===1){
        L.marker([tk[0].lat,tk[0].lng]).addTo(petaObj).bindPopup(esc(r.name));
      }

      setTimeout(function(){ if(petaObj) petaObj.invalidateSize(); }, 220);
    }catch(e){
      el.innerHTML='<div class="kosong">Gagal memuat peta: '+esc(e.message)+'</div>';
    }
  });
}

/* ---------------- Menggambar & mengubah jalur di atas peta ---------------- */

function mulaiEditJalur(){
  var r=ruteAktif(); if(!r) return;
  jalurDraft=titikRute(r);
  modeEditJalur=true;
  renderPaksa();
  toast('Ketuk peta untuk menambah titik jalur','info');
}

function batalEditJalur(){
  modeEditJalur=false; jalurDraft=[]; renderPaksa();
}

function tambahTitik(la, ln){
  jalurDraft.push({lat:la, lng:ln, label:''});
  gambarDraft(); perbaruiInfoDraft();
}

function hapusTitik(i){
  jalurDraft.splice(i,1);
  gambarDraft(); perbaruiInfoDraft();
  toast('Titik '+(i+1)+' dihapus','info');
}

function undoTitik(){
  if(!jalurDraft.length) return toast('Belum ada titik','info');
  jalurDraft.pop(); gambarDraft(); perbaruiInfoDraft();
}

function kosongkanJalur(){
  if(!jalurDraft.length) return;
  jalurDraft=[]; gambarDraft(); perbaruiInfoDraft();
  toast('Semua titik dikosongkan','info');
}

function titikDariGps(){
  if(!navigator.geolocation) return toast('Perangkat tidak mendukung GPS','err');
  toast('Mengambil lokasi…','info');
  navigator.geolocation.getCurrentPosition(function(pos){
    tambahTitik(pos.coords.latitude, pos.coords.longitude);
    if(petaObj) petaObj.setView([pos.coords.latitude, pos.coords.longitude], 17);
    toast('Titik lokasimu ditambahkan','ok');
  }, function(e){
    toast('GPS gagal: '+e.message,'err');
  }, {enableHighAccuracy:true, timeout:15000});
}

function panjangDraft(){
  var t=0;
  for(var i=1;i<jalurDraft.length;i++){
    t+=jarakKm(jalurDraft[i-1].lat, jalurDraft[i-1].lng, jalurDraft[i].lat, jalurDraft[i].lng);
  }
  return t;
}

function perbaruiInfoDraft(){
  var a=document.getElementById('jmlTitik'), b=document.getElementById('jarakDraft');
  if(a) a.textContent=jalurDraft.length;
  if(b) b.textContent=panjangDraft().toFixed(2);
}

function gambarDraft(){
  if(!petaObj || !window.L) return;
  if(lapisanDraft){ petaObj.removeLayer(lapisanDraft); lapisanDraft=null; }
  penandaDraft.forEach(function(m){ petaObj.removeLayer(m); });
  penandaDraft=[];

  var ll=jalurDraft.map(function(t){ return [t.lat,t.lng]; });
  if(ll.length>1){
    lapisanDraft=L.polyline(ll,{color:'#0ea5e9', weight:5, opacity:.9, dashArray:'7 6'}).addTo(petaObj);
  }
  jalurDraft.forEach(function(t,i){
    var m=L.circleMarker([t.lat,t.lng],
      {radius:8, color:'#0ea5e9', fillColor:'#ffffff', fillOpacity:1, weight:3}).addTo(petaObj);
    m.bindTooltip(String(i+1),{permanent:true, direction:'top', offset:[0,-6], className:'tt-titik'});
    m.on('click', function(ev){
      if(ev.originalEvent && ev.originalEvent.stopPropagation) ev.originalEvent.stopPropagation();
      if(L.DomEvent && ev.originalEvent) L.DomEvent.stop(ev.originalEvent);
      hapusTitik(i);
    });
    penandaDraft.push(m);
  });
}

function simpanJalur(){
  var r=ruteAktif(); if(!r) return;
  if(jalurDraft.length<2) return toast('Butuh minimal 2 titik untuk membentuk jalur','err');

  var jarak=Math.round(panjangDraft()*100)/100;
  var sepeda=(r.type==='Bersepeda');
  var menit=Math.round(jarak*(sepeda?3.5:9));
  var kal=Math.round(jarak*n(S.profil.weightKg,70)*(sepeda?0.45:1.036));
  var titik=jalurDraft.slice();

  var data={
    id:r.id, name:r.name, locationName:r.locationName, type:r.type,
    difficulty:r.difficulty, description:r.description,
    distanceKm:jarak, estimatedMinutes:menit, caloriesBurned:kal,
    center:{lat:titik[0].lat, lng:titik[0].lng}, waypoints:titik
  };

  modeEditJalur=false; jalurDraft=[];
  ubah('rute_simpan', data, function(){
    r.waypoints=titik; r.distanceKm=jarak; r.estimatedMinutes=menit;
    r.caloriesBurned=kal; r.center=data.center;
  });
  toast('Jalur tersimpan · '+jarak.toFixed(2)+' km, ~'+menit+' menit','ok');
}

function simpanRute(){
  var id=document.getElementById('rtId').value;
  var lama=id ? (S.rute||[]).filter(function(x){ return x.id===id; })[0] : null;

  var lat=parseFloat(document.getElementById('rtLat').value);
  var lng=parseFloat(document.getElementById('rtLng').value);
  if(isNaN(lat)) lat = (lama&&lama.center) ? n(lama.center.lat,-6.2) : -6.2;
  if(isNaN(lng)) lng = (lama&&lama.center) ? n(lama.center.lng,106.8) : 106.8;

  var data={
    id: id || idBaru('rt'),
    name: document.getElementById('rtNama').value.trim() || 'Rute Baru',
    locationName: document.getElementById('rtLokasi').value.trim(),
    type: document.getElementById('rtTipe').value,
    difficulty: document.getElementById('rtTingkat').value,
    distanceKm: n(document.getElementById('rtJarak').value),
    estimatedMinutes: n(document.getElementById('rtMenit').value),
    caloriesBurned: lama ? n(lama.caloriesBurned) : 0,
    description: document.getElementById('rtDesk').value.trim(),
    center: {lat:lat, lng:lng},
    waypoints: lama ? titikRute(lama) : [{lat:lat, lng:lng, label:'Start'}]
  };

  var sepeda=(data.type==='Bersepeda');
  if(!data.estimatedMinutes && data.distanceKm) data.estimatedMinutes=Math.round(data.distanceKm*(sepeda?3.5:9));
  if(!data.caloriesBurned && data.distanceKm){
    data.caloriesBurned=Math.round(data.distanceKm*n(S.profil.weightKg,70)*(sepeda?0.45:1.036));
  }

  tutupModal();
  ruteTerpilih=data.id;
  ubah('rute_simpan', data, function(){
    S.rute=S.rute||[];
    var i=-1;
    for(var k=0;k<S.rute.length;k++) if(S.rute[k].id===data.id) i=k;
    if(i>=0) S.rute[i]=data; else S.rute.push(data);
  });
  toast(id?'Rute diperbarui':'Rute baru dibuat. Gambar jalurnya lewat “Ubah Jalur di Peta”.','ok');
}

function hapusRute(id){
  var r=(S.rute||[]).filter(function(x){ return x.id===id; })[0];
  if(!r) return;
  if(!confirm('Hapus rute "'+r.name+'"? Tindakan ini tidak bisa dibatalkan.')) return;
  ubah('rute_hapus', {id:id}, function(){
    S.rute=(S.rute||[]).filter(function(x){ return x.id!==id; });
    if(ruteTerpilih===id) ruteTerpilih=(S.rute[0]||{}).id||null;
  });
  toast('Rute dihapus','ok');
}

function muatLeaflet(cb){
  if(window.L) return cb(true);
  if(!navigator.onLine) return cb(false);
  var css=document.createElement('link');
  css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(css);
  var js=document.createElement('script');
  js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  js.onload=function(){ cb(true); };
  js.onerror=function(){ cb(false); };
  document.head.appendChild(js);
}

function jarakKm(a1,b1,a2,b2){
  var R=6371, dLat=(a2-a1)*Math.PI/180, dLon=(b2-b1)*Math.PI/180;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a1*Math.PI/180)*Math.cos(a2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R*2*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function jadwalkanRute(id){
  var r=(S.rute||[]).filter(function(x){ return x.id===id; })[0];
  if(!r) return;
  modalJadwal({

    durationMinutes:r.estimatedMinutes, targetCalories:r.caloriesBurned, notes:r.locationName
  });
}

var aliranKamera=null, detektor=null, timerScan=null;
function mulaiKamera(){
  var v=document.getElementById('vidBar');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(st){
    aliranKamera=st; v.srcObject=st; v.style.display='block'; v.play();
    if('BarcodeDetector' in window){
      detektor=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});
      timerScan=setInterval(function(){
        detektor.detect(v).then(function(kode){
          if(kode && kode.length){
            document.getElementById('inpBarcode').value=kode[0].rawValue;
            hentikanKamera();
            cariBarcode();
          }
        }).catch(function(){});
      }, 700);
    } else {
      toast('Deteksi otomatis tidak didukung. Ketik barcode manual.','info');
    }
  }).catch(function(e){
    toast('Kamera tidak dapat dibuka: '+e.message,'err');
  });
}
function hentikanKamera(){
  if(timerScan){ clearInterval(timerScan); timerScan=null; }
  if(aliranKamera){ aliranKamera.getTracks().forEach(function(t){ t.stop(); }); aliranKamera=null; }
  var v=document.getElementById('vidBar');
  if(v){ v.style.display='none'; v.srcObject=null; }
}

function cariBarcode(){
  var kode=(document.getElementById('inpBarcode').value||'').trim();
  if(!kode) return toast('Isi nomor barcode dulu','err');
  var el=document.getElementById('hasilBarcode');

  var lokal=(S.makanan||[]).filter(function(m){ return String(m.barcode)===kode; })[0];
  if(lokal){ el.innerHTML=kartuHasilMakanan(lokal,'basis data lokal'); return; }
  if(!online) { el.innerHTML='<p class="kecil">Tidak ada di data offline. Sambungkan internet untuk mencari di basis data global, atau <a href="#" onclick="modalTambahMakanan({barcode:\''+jsq(kode)+'\'});return false">tambah manual</a>.</p>'; return; }

  el.innerHTML='<p class="kecil"><span class="muat hijau"></span> Mencari produk…</p>';
  api('barcode_cari', {barcode:kode}).then(function(r){
    if(!r.makanan){
      el.innerHTML='<p class="kecil">Produk tidak ditemukan. <a href="#" onclick="modalTambahMakanan({barcode:\''+jsq(kode)+'\'});return false">Tambah manual</a></p>';
      return;
    }
    if(r.sumber!=='lokal'){ S.makanan=S.makanan||[]; S.makanan.unshift(r.makanan); simpan(K.DATA,S); }
    el.innerHTML=kartuHasilMakanan(r.makanan, r.sumber==='lokal'?'basis data lokal':'Open Food Facts');
  }).catch(function(e){
    el.innerHTML='<p class="kecil" style="color:var(--merah)">'+esc(e.message)+'</p>';
  });
}

function pindaiLabel(input, jenis){
  var file=input.files && input.files[0];
  input.value='';
  if(!file) return;
  if(!S.aiAktif) return toast('Fitur AI belum aktif','err');
  if(!online) return toast('Pindai AI butuh koneksi internet','err');

  var el=document.getElementById('hasilFoto');
  el.innerHTML='<p class="kecil"><span class="muat hijau"></span> Mengunggah & menganalisis foto…</p>';

  kecilkanGambar(file, 1024, function(b64){

      el.innerHTML='<p class="kecil" style="color:var(--merah)">'+esc(e.message)+'</p>';
    });
  });

/** Kecilkan gambar di sisi klien agar hemat kuota dan cepat. */
function kecilkanGambar(file, maksSisi, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var s=Math.min(1, maksSisi/Math.max(img.width, img.height));
      var c=document.createElement('canvas');
      c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.82).split(',')[1]);
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

        }).join('')

    '<div class="baris wrap" style="gap:8px; margin-top:12px">'+
      '<button class="b garis" onclick="pindaiBluetooth(false)">🔎 Pindai Perangkat Detak Jantung</button>'+

    '</div>'+
    '<p class="kecil" style="margin-top:10px">Pemindaian mencari perangkat yang menyiarkan layanan <b>Heart Rate</b> standar — kebanyakan chest strap dan sebagian smartband mendukungnya, dan detaknya akan langsung mengisi angka besar di atas. Perangkat yang mengunci datanya di aplikasi resmi (Galaxy Fit 3 lewat Samsung Health, Apple Watch lewat Health, Mi Band lewat Mi Fitness) tidak akan muncul: daftarkan manual dari katalog, lalu masukkan angkanya lewat <b>Catat Manual</b>.</p>'+

/* ---------------- Pemindaian Bluetooth (Web Bluetooth API) ---------------- */

var btPerangkat=null, btKarakteristik=null, bpmTerakhirRender=0;

function pindaiBluetooth(semua){
  if(!navigator.bluetooth){
    return toast('Peramban ini belum mendukung Web Bluetooth. Gunakan Chrome atau Edge di Android maupun desktop.','err');
  }
  var opsi = semua
    ? {acceptAllDevices:true, optionalServices:['heart_rate','battery_service','device_information']}
    : {filters:[{services:['heart_rate']}], optionalServices:['battery_service','device_information']};

  toast('Membuka daftar perangkat Bluetooth…','info');

  navigator.bluetooth.requestDevice(opsi).then(function(dev){
    btPerangkat=dev;
    dev.addEventListener('gattserverdisconnected', function(){
      toast((dev.name||'Perangkat')+' terputus','info');
      var d=(S.perangkat||[]).filter(function(x){ return x.name===(dev.name||''); })[0];
      if(d && d.connected){
        terapkanPerangkat({id:d.id, name:d.name, brand:d.brand, batteryLevel:n(d.batteryLevel),
                           connected:false, lastSyncedAt:'Terputus'});
      }
    });
    return dev.gatt.connect().then(function(server){
      var nama=dev.name||'Perangkat Bluetooth';
      var sudah=(S.perangkat||[]).filter(function(x){ return x.name===nama; })[0];
      var rec={
        id: sudah ? sudah.id : idBaru('dev'),
        name: nama, brand: tebakMerek(nama), batteryLevel: 0,
        connected: true, lastSyncedAt: jamKini()
      };
      return bacaBaterai(server).then(function(b){
        rec.batteryLevel=b;
        terapkanPerangkat(rec);
        toast('Tersambung ke '+nama,'ok');
        return pasangDetak(server);
      });
    });
  }).catch(function(e){
    var nama=(e && e.name) ? e.name : '';
    if(nama==='NotFoundError') return toast('Tidak ada perangkat yang dipilih','info');
    if(nama==='SecurityError') return toast('Bluetooth diblokir di halaman ini. Buka versi GitHub Pages (HTTPS) untuk memakainya.','err');
    toast('Bluetooth gagal: '+((e&&e.message)?e.message:e),'err');
  });
}

function bacaBaterai(server){
  return server.getPrimaryService('battery_service')
    .then(function(s){ return s.getCharacteristic('battery_level'); })
    .then(function(c){ return c.readValue(); })
    .then(function(v){ return v.getUint8(0); })
    .catch(function(){ return 0; });
}

function pasangDetak(server){
  return server.getPrimaryService('heart_rate')
    .then(function(s){ return s.getCharacteristic('heart_rate_measurement'); })
    .then(function(c){ btKarakteristik=c; return c.startNotifications(); })
    .then(function(c){
      c.addEventListener('characteristicvaluechanged', terimaDetak);
      toast('Detak jantung langsung dari perangkat kini aktif','ok');
    })
    .catch(function(){
      toast('Perangkat tersambung, tetapi tidak menyiarkan detak jantung standar. Pakai “Catat Manual”.','info');
    });
}

/** Bit pertama pada flag menentukan apakah nilai BPM 8-bit atau 16-bit. */
function terimaDetak(e){
  var d=e.target.value;
  var bendera=d.getUint8(0);
  var bpm=(bendera & 0x01) ? d.getUint16(1, true) : d.getUint8(1);
  if(!bpm || bpm<25 || bpm>250) return;
  bpmKini=bpm;
  riwayatBpm.push(bpm);
  if(sedangMerekam() && rec.status==='jalan') rec.hrList.push(bpm);
  var kini=Date.now();
  if(tab==='wearable' && kini-bpmTerakhirRender>1200){ bpmTerakhirRender=kini; render(); }
}

function tebakMerek(nama){
  nama=String(nama||'').toLowerCase();
  var peta=[['galaxy','Samsung'],['samsung','Samsung'],['apple','Apple Watch'],['garmin','Garmin'],
            ['fitbit','Fitbit'],['mi band','Xiaomi'],['xiaomi','Xiaomi'],['redmi','Xiaomi'],
            ['huawei','Huawei'],['honor','Honor'],['amazfit','Amazfit'],['zepp','Amazfit'],
            ['polar','Polar'],['coospo','Coospo'],['wahoo','Wahoo'],['oppo','OPPO'],['realme','realme']];
  for(var i=0;i<peta.length;i++) if(nama.indexOf(peta[i][0])>=0) return peta[i][1];
  return 'Lainnya';
}

function zonaDetak(bpm, maks){
  var p=bpm/maks*100;
  if(p<60) return {nama:'Istirahat / Pemanasan'};
  if(p<70) return {nama:'Pembakaran Lemak'};
  if(p<85) return {nama:'Kardio'};
  return {nama:'Zona Puncak'};
}

function toggleSimulasi(){
  var b=document.getElementById('btnSimulasi');
  if(timerBpm){
    clearInterval(timerBpm); timerBpm=null; b.textContent='▶️ Mulai Pantau';
    if(riwayatBpm.length){
      var rata=Math.round(riwayatBpm.reduce(function(a,c){return a+c},0)/riwayatBpm.length);
      var maks=Math.max.apply(null, riwayatBpm);
      var tgl=hariIni(), a=aktivitasHari(tgl);
      a.avgHeartRate=rata; a.maxHeartRate=maks;
      ubah('aktivitas_set', {date:tgl, steps:a.steps, activeCalories:a.activeCalories, distanceKm:a.distanceKm,
        sleepHours:a.sleepHours, avgHeartRate:rata, maxHeartRate:maks}, function(){
        S.aktivitas=(S.aktivitas||[]).filter(function(x){ return x.date!==tgl; }); S.aktivitas.push(a);
      });
      toast('Tersimpan: rata-rata '+rata+' BPM, puncak '+maks+' BPM','ok');
    }
    return;
  }
  riwayatBpm=[];
  b.textContent='⏹ Hentikan';
  timerBpm=setInterval(function(){
    bpmKini=Math.max(58, Math.min(178, bpmKini+Math.round((Math.random()-0.45)*9)));
    riwayatBpm.push(bpmKini);
    if(tab==='wearable') render();
  }, 1600);
}

function viewLaporan(){
  var hari=tujuhHari(), p=S.profil||{};

  var h='<div class="kartu">'+
      '<div class="baris rata"><h3>📈 Kalori 7 Hari Terakhir</h3>'+

        hari.map(function(t,i){

          return '<div><div class="btg" style="height:'+tinggi+'%" title="'+rb(data[i].kalori)+' kkal"></div>'+
                 '<div class="lbl">'+namaHari(t).substring(0,3)+'</div></div>';

      '</div>'+
      '<div class="kecil tengah" style="margin-top:6px">Target harian: '+rb(p.dailyCalorieTarget)+' kkal</div>'+
    '</div>';

  /* ringkasan mingguan */
  var totKal=0, totLangkah=0, totAir=0, hariAktif=0;
  hari.forEach(function(t,i){
    totKal+=data[i].kalori; totLangkah+=n(aktivitasHari(t).steps); totAir+=airHari(t);
    if(data[i].kalori>0) hariAktif++;
  });
  var menit=0;
  (S.jadwal||[]).forEach(function(j){ if(hari.indexOf(j.date)>=0 && j.completed) menit+=n(j.durationMinutes); });

  h+='<div class="kartu"><h3>Ringkasan Minggu Ini</h3><div class="grid g4">'+
      kartuStat('Total Kalori', rb(totKal))+
      kartuStat('Rata-rata/Hari', rb(Math.round(totKal/7)))+

      kartuStat('Menit Latihan', rb(menit))+

    '<button class="b penuh" style="margin-top:11px" onclick="mintaLaporan()" '+(S.aiAktif?'':'disabled')+'>✨ Buat Ulasan AI Mingguan</button>'+
    '<div id="isiLaporan"></div></div>';

  /* kalender latihan */
  h+='<div class="kartu">'+
      '<div class="baris rata"><h3>🗓️ Jadwal Latihan</h3>'+
        '<button class="b kecilb" onclick="modalJadwal()">+ Tambah</button></div>'+
      (function(){
        var jd=(S.jadwal||[]).slice().sort(function(a,b){ return (a.date+a.time)<(b.date+b.time)?-1:1; });
        if(!jd.length) return '<p class="kecil">Belum ada jadwal latihan.</p>';
        var grup={};
        jd.forEach(function(j){ (grup[j.date]=grup[j.date]||[]).push(j); });
        return Object.keys(grup).sort().map(function(t){
          return '<h4 style="margin-top:12px">'+namaHari(t)+', '+tglIndo(t)+'</h4>'+
                 grup[t].map(barisJadwal).join('');
        }).join('');
      })()+
    '</div>';

  /* riwayat berat */
  var beratData=(S.aktivitas||[]).filter(function(a){ return n(a.weightKg)>0; }).slice(-14);
  if(beratData.length>1){
    var minB=Math.min.apply(null, beratData.map(function(a){return n(a.weightKg)}));

      '<div class="kecil tengah" style="margin-top:6px">'+minB+' – '+maxB+' kg · target '+n(p.targetWeightKg)+' kg</div></div>';
  }

function fotoPratinjau(url){
  return url
    ? '<img src="'+esc(url)+'" class="foto-pratinjau" alt="Foto profil" onclick="zoomFotoProfil()">'
    : '<div class="foto-pratinjau tanpa-foto">👤</div>';

/**
 * Foto dipotong menjadi persegi lalu dikecilkan ke 320 px. Kualitasnya
 * diturunkan bertahap sampai muat di satu sel Google Sheets, yang hanya
 * sanggup menampung sekitar 50.000 karakter.
 */
function siapkanFotoProfil(file, cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var sisi=Math.min(img.width, img.height);
      var sx=(img.width-sisi)/2, sy=(img.height-sisi)/2;
      var c=document.createElement('canvas');
      c.width=320; c.height=320;
      c.getContext('2d').drawImage(img, sx, sy, sisi, sisi, 0, 0, 320, 320);
      var q=0.72, url=c.toDataURL('image/jpeg', q);
      while(url.length>42000 && q>0.32){ q-=0.08; url=c.toDataURL('image/jpeg', q); }
      cb(url.length<=46000 ? url : null);
    };
    img.onerror=function(){ cb(null); };
    img.src=fr.result;
  };
  fr.onerror=function(){ cb(null); };
  fr.readAsDataURL(file);
}

function pilihFotoProfil(input){
  var file=input.files && input.files[0];
  input.value='';
  if(!file) return;
  toast('Menyiapkan foto…','info');
  siapkanFotoProfil(file, function(url){
    if(!url) return toast('Foto tidak dapat diproses. Coba gambar lain.','err');
    var kotak=document.getElementById('pfKotakFoto');
    if(kotak) kotak.innerHTML=fotoPratinjau(url);
    terapkanFotoProfil(url);
  });
}

      '<div class="zoom-alat">'+
        '<button onclick="zoomLangkah(-0.3)" title="Perkecil">−</button>'+
        '<button onclick="zoomReset()" title="Kembalikan">⟲</button>'+
        '<button onclick="zoomLangkah(0.3)" title="Perbesar">+</button>'+
      '</div>'+
    '</div>');

  var t=document.getElementById('zoomTirai');
  var g=document.getElementById('zoomGbr');

  function cekKecil(){ if(g.naturalWidth && g.naturalWidth<700) g.classList.add('kecil'); }
  if(g.complete) cekKecil(); else g.onload=cekKecil;

  t.addEventListener('wheel', function(e){
    e.preventDefault();
    zoomLangkah(e.deltaY<0 ? 0.2 : -0.2);
  }, {passive:false});

  t.addEventListener('mousedown', function(e){
    if(e.target.tagName==='BUTTON') return;
    zoomState.seret=true;
    zoomState.mx=e.clientX-zoomState.x;
    zoomState.my=e.clientY-zoomState.y;
    t.style.cursor='grabbing';
  });

  t.addEventListener('touchstart', function(e){
    if(e.touches.length===2){
      zoomState.jarakAwal=jarakSentuh(e.touches);
      zoomState.skalaAwal=zoomState.skala;
    } else if(e.touches.length===1){
      zoomState.seret=true;
      zoomState.mx=e.touches[0].clientX-zoomState.x;
      zoomState.my=e.touches[0].clientY-zoomState.y;
    }
  }, {passive:true});

  t.addEventListener('touchmove', function(e){
    if(e.touches.length===2 && zoomState.jarakAwal){
      e.preventDefault();
      var rasio=jarakSentuh(e.touches)/zoomState.jarakAwal;
      zoomState.skala=Math.min(6, Math.max(1, zoomState.skalaAwal*rasio));
      terapkanZoom();
    } else if(e.touches.length===1 && zoomState.seret && zoomState.skala>1){
      e.preventDefault();
      zoomState.x=e.touches[0].clientX-zoomState.mx;
      zoomState.y=e.touches[0].clientY-zoomState.my;
      terapkanZoom();
    }
  }, {passive:false});

  t.addEventListener('touchend', function(e){
    if(e.touches.length===0){ zoomState.seret=false; zoomState.jarakAwal=0; }
  }, {passive:true});

  g.addEventListener('dblclick', function(){
    zoomState.skala = zoomState.skala>1 ? 1 : 2.5;
    zoomState.x=0; zoomState.y=0;
    terapkanZoom();
  });

  window.addEventListener('mousemove', geserZoom);
  window.addEventListener('mouseup', lepasZoom);
  window.addEventListener('keydown', tombolZoom);
  document.body.style.overflow='hidden';
  terapkanZoom();
}

function jarakSentuh(t){
  var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

function geserZoom(e){
  if(!zoomState.seret || zoomState.skala<=1) return;
  zoomState.x=e.clientX-zoomState.mx;
  zoomState.y=e.clientY-zoomState.my;
  terapkanZoom();
}

function lepasZoom(){
  zoomState.seret=false;
  var t=document.getElementById('zoomTirai');
  if(t) t.style.cursor='grab';
}

function tombolZoom(e){
  if(!document.getElementById('zoomTirai')) return;
  if(e.key==='Escape') tutupZoom();
  else if(e.key==='+' || e.key==='=') zoomLangkah(0.3);
  else if(e.key==='-') zoomLangkah(-0.3);
  else if(e.key==='0') zoomReset();
}

function zoomLangkah(d){
  zoomState.skala=Math.min(6, Math.max(1, zoomState.skala+d));
  if(zoomState.skala<=1){ zoomState.x=0; zoomState.y=0; }
  terapkanZoom();
}

function zoomReset(){
  zoomState.skala=1; zoomState.x=0; zoomState.y=0;
  terapkanZoom();
}

function terapkanZoom(){
  var g=document.getElementById('zoomGbr'); if(!g) return;
  g.style.transform='translate('+zoomState.x+'px,'+zoomState.y+'px) scale('+zoomState.skala+')';
  var i=document.getElementById('zoomInfo');
  if(i) i.textContent=zoomState.judul+' · '+Math.round(zoomState.skala*100)+'%';
}

function tutupZoom(){
  var t=document.getElementById('zoomTirai');
  if(t) t.parentNode.removeChild(t);
  window.removeEventListener('mousemove', geserZoom);
  window.removeEventListener('mouseup', lepasZoom);
  window.removeEventListener('keydown', tombolZoom);
  if(!document.querySelector('.tirai')) document.body.style.overflow='';
}

function simpanProfil(){
  var data={
    name:document.getElementById('pfNama').value.trim(),
    age:n(document.getElementById('pfUsia').value,28),
    gender:document.getElementById('pfKelamin').value,
    heightCm:n(document.getElementById('pfTinggi').value,170),
    weightKg:n(document.getElementById('pfBerat').value,70),
    targetWeightKg:n(document.getElementById('pfTarget').value,66),
    dailyStepsTarget:n(document.getElementById('pfLangkah').value,8000),
    dietaryGoal:document.getElementById('pfTujuan').value,
    activityLevel:document.getElementById('pfAktivitas').value,
    aiTonePreference:document.getElementById('pfNada').value
  };
  tutupModal();
  /* hitung target lokal agar tampilan langsung berubah walau offline */
  var bmr=(10*data.weightKg)+(6.25*data.heightCm)-(5*data.age)+(data.gender==='wanita'?-161:5);
  var fk={sedentari:1.2, ringan:1.375, sedang:1.55, berat:1.725, ekstrem:1.9}[data.activityLevel]||1.55;
  var tdee=bmr*fk;
  var kal=data.dietaryGoal==='turun_bb'?tdee-500:(data.dietaryGoal==='tambah_otot'?tdee+300:tdee);
  kal=Math.max(1200, Math.round(kal/10)*10);
  var ppk=data.dietaryGoal==='tambah_otot'?1.8:(data.dietaryGoal==='turun_bb'?1.6:1.3);
  var pro=Math.round(data.weightKg*ppk), lem=Math.round(kal*0.25/9);

  ubah('profil_update', data, function(){
    for(var k in data) S.profil[k]=data[k];
    S.profil.dailyCalorieTarget=kal;
    S.profil.dailyProteinTarget=pro;
    S.profil.dailyFatTarget=lem;
    S.profil.dailyCarbsTarget=Math.max(50, Math.round((kal-pro*4-lem*9)/4));
    S.profil.dailyWaterTargetMl=Math.max(1500, Math.round(data.weightKg*35/50)*50);
    S.profil.turunan={bmr:Math.round(bmr), tdee:Math.round(tdee),
      bmi:Math.round(data.weightKg/Math.pow(data.heightCm/100,2)*10)/10};
  });
  toast('Profil & target diperbarui','ok');
}

function modalNotifikasi(){
  bukaModal('🔔 Pengingat Harian',
    (S.notifikasi||[]).map(function(nt){
      return '<div class="item">'+
        '<div class="emo">'+(nt.type==='water'?'💧':nt.type==='meal'?'🍽️':nt.type==='workout'?'🏋️':'❤️')+'</div>'+
        '<div class="tumbuh"><div style="font-weight:600; font-size:14px">'+esc(nt.title)+'</div>'+
        '<div class="kecil">'+esc(nt.time)+' · '+esc(nt.message)+'</div></div>'+
        '<button class="b kecilb '+(nt.enabled?'':'abu')+'" onclick="toggleNotif(\''+jsq(nt.id)+'\')">'+(nt.enabled?'Aktif':'Mati')+'</button>'+
      '</div>';
    }).join('')+
    '<p class="kecil" style="margin-top:12px">Pengingat muncul sebagai notifikasi peramban selama aplikasi masih terbuka di latar belakang. '+
    'Izinkan notifikasi bila diminta.</p>'+
    '<button class="b penuh garis" onclick="mintaIzinNotif()">Aktifkan Notifikasi Peramban</button>'
  );
}

function toggleNotif(id){
  var nt=(S.notifikasi||[]).filter(function(x){ return x.id===id; })[0];
  if(!nt) return;
  nt.enabled=!nt.enabled;
  ubah('notifikasi_simpan', nt, function(){});
  tutupModal(); modalNotifikasi();
}

function mintaIzinNotif(){
  if(!('Notification' in window)) return toast('Peramban tidak mendukung notifikasi','err');
  Notification.requestPermission().then(function(izin){
    toast(izin==='granted'?'Notifikasi diaktifkan':'Izin notifikasi ditolak', izin==='granted'?'ok':'info');
    if(izin==='granted') pasangPengingat();
  });
}

var timerPengingat=null;
function pasangPengingat(){
  if(timerPengingat) clearInterval(timerPengingat);
  timerPengingat=setInterval(function(){
    if(Notification.permission!=='granted' || !S) return;
    var jam=jamKini();
    (S.notifikasi||[]).forEach(function(nt){
      if(nt.enabled && nt.time===jam){
        var kunci='notif_'+nt.id+'_'+hariIni();
        if(localStorage.getItem(kunci)) return;
        localStorage.setItem(kunci,'1');
        try{ new Notification(nt.title, {body:nt.message, icon:'icon.svg'}); }catch(e){}
      }
    });
  }, 30000);
}

/* ================================================================
   MODAL UMUM
   ================================================================ */
function bukaModal(judul, isi){
  document.getElementById('modalHost').innerHTML =
    '<div class="tirai" onclick="if(event.target===this) tutupModal()">'+
      '<div class="modal">'+
        '<div class="modal-judul"><h2>'+esc(judul)+'</h2><button class="tutup" onclick="tutupModal()">✕</button></div>'+
        isi+
      '</div>'+
    '</div>';
  document.body.style.overflow='hidden';
}
function tutupModal(){
  document.getElementById('modalHost').innerHTML='';
  document.body.style.overflow='';
}

/* ================================================================
   TEMA, KONEKSI, INISIALISASI
   ================================================================ */
function setTema(t){
  document.documentElement.setAttribute('data-tema', t);
  document.getElementById('btnTema').textContent = t==='gelap' ? '☀️' : '🌙';
  simpan(K.TEMA, t);
}

function pantauKoneksi(){
  function ubahStatus(){
    online = navigator.onLine;
    perbaruiStatus();
    if(online){
      sinkronAntrean().then(function(){ return muatData(true); });
    } else {
      toast('Mode offline aktif. Perubahanmu tetap tersimpan.','info');
    }
  }
  window.addEventListener('online', ubahStatus);
  window.addEventListener('offline', ubahStatus);
}

function daftarSW(){
  if(!('serviceWorker' in navigator)) return;
  if(location.protocol==='file:') return;
  if(location.hostname.indexOf('script.google')>=0) return;  /* GAS memakai iframe sandbox */
  navigator.serviceWorker.register('sw.js').catch(function(){});
}

document.getElementById('btnTema').onclick=function(){
  setTema(document.documentElement.getAttribute('data-tema')==='gelap'?'terang':'gelap');
};
document.getElementById('btnNotif').onclick=modalNotifikasi;
document.getElementById('btnProfil').onclick=modalProfil;

window.addEventListener('beforeunload', function(){ hentikanKamera(); });

(function mulai(){
  setTema(baca(K.TEMA,'terang'));
  pantauKoneksi();
  daftarSW();
  muatData(true).then(function(){
    if(baca(K.ANTREAN,[]).length) sinkronAntrean();
    if('Notification' in window && Notification.permission==='granted') pasangPengingat();
    // Ditawarkan setelah data siap, supaya rute dan profil sudah tersedia.
    setTimeout(periksaRekamTertunda, 600);
  });

  /* Kesempatan terakhir menyimpan keadaan sebelum halaman ditutup sistem. */
  window.addEventListener('pagehide', function(){ if(sedangMerekam()) simpanStatusRekam(true); });
  window.addEventListener('beforeunload', function(e){
    if(!sedangMerekam()) return;
    simpanStatusRekam(true);
    e.preventDefault(); e.returnValue='';
  });
  /* segarkan data tiap 5 menit saat online */
  setInterval(function(){ if(online && !document.hidden) muatData(true); }, 300000);
})();
</script>
